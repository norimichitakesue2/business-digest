<title>世界の流れ（見本）</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1a1d23;--sub:#5b6270;--line:#e3e6eb;--land:#dfe3e8;--sea:#eef3f8;--pos:#16a34a;--neg:#dc2626;--mix:#9aa3ae;--landHi:#c9d0d8}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:0 0 2px}.lead{color:var(--sub);font-size:13px;margin:0 0 16px}

.chip .dot{width:9px;height:9px;border-radius:50%}.chip.on{color:#fff;border-color:transparent}
.grid{display:grid;grid-template-columns:1fr 320px;gap:14px}@media(max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
svg{width:100%;height:auto;display:block}.ctry{fill:var(--land);stroke:var(--card);stroke-width:.5}.ctry.hit{cursor:pointer}.ctry.hit:hover{filter:brightness(.92)}
.sea{fill:var(--sea)}.grat{fill:none;stroke:var(--line);stroke-width:.4}
.arc{fill:none;stroke-width:2.2;opacity:.85}.arcl{font-size:12.5px;font-weight:600;paint-order:stroke;stroke:var(--card);stroke-width:3px;fill:var(--ink)}

.flag{width:20px;height:15px;border-radius:2px;vertical-align:-2px;box-shadow:0 0 0 1px rgba(0,0,0,.08)}

.tag{font-size:11px;padding:0 7px;border-radius:9px;color:#fff;margin-right:6px;white-space:nowrap}
h2{font-size:17px;margin:26px 0 10px}
.links{display:flex;flex-wrap:wrap;gap:8px}.link{font-size:12.5px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px}

.st{border-top:4px solid}.st h3{margin:0;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.flags{display:flex;gap:3px}.one{font-size:13px;margin:6px 0 10px}
.phase{display:flex;gap:3px;margin:4px 0 2px}.phase span{flex:1;font-size:10.5px;text-align:center;padding:3px 0;border-radius:4px;background:var(--line);color:var(--sub)}
.phase span.cur{color:#fff;font-weight:600}.phase span.prev{outline:1.5px dashed var(--sub);outline-offset:-2px}
.ph-note{font-size:11px;color:var(--sub);margin-bottom:10px}
.mech{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:12px;margin-bottom:10px}.mech b{font-weight:500;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 7px}.mech em{font-style:normal;color:var(--sub)}

.ev{font-size:12.5px;margin:0;padding:0;list-style:none}.ev li{margin:3px 0;display:flex;gap:6px;align-items:flex-start}.ev .flag{flex:none;margin-top:3px}
.kv{font-size:12.5px}.qs{display:flex;flex-wrap:wrap;gap:5px}.qs span{font-size:11.5px;border:1px solid var(--line);border-radius:10px;padding:1px 8px}
.news li{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}.news{list-style:none;padding:0;margin:0}.ind2{font-size:11px;color:var(--sub);min-width:62px}
.note{font-size:12px;color:var(--sub);margin-top:24px}

<h1>世界の流れ <span class="badge">見本・11/3のニュースで作成</span></h1>
<p class="lead">7本の大きな流れで、その日のニュースが世界のどこで何につながっているかを見る。流れを選ぶと地図が切り替わり、国を押すとその国の動きが出ます。</p>
<div class="chips" id="chips"></div>
<div class="grid"><div class="card"><svg id="map"></svg>
<div class="legend"><span><i style="background:var(--pos)"></i>追い風</span><span><i style="background:var(--neg)"></i>逆風・緊張</span><span><i style="background:var(--mix)"></i>強弱まちまち</span><span>矢印＝お金・モノ・リスクの流れ</span></div></div>
<div class="card panel" id="panel"></div></div>
<h2>流れどうしのつながり</h2><div class="links" id="links"></div>
<h2>7つの流れ</h2><div class="streams" id="streams"></div>
<h2>きょうのニュース（国旗つき表示の例）</h2><div class="card"><ul class="news" id="news"></ul></div>
<p class="note">フェーズや流れへの振り分けは見本用の暫定判断です。本番では毎日のニュースに「流れ」「関係する国」を付けて自動で積み上げます。</p>
