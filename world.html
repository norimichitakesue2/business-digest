"china", "bloc", "過剰輸出→関税・ブロック化"], ["bloc", "sec", "対立の激化→防衛費"], ["ai", "mideast", "DC電力需要→エネルギー争奪"], ["demo", "ai", "人手不足→AI・自動化の需要"], ["sec", "rate", "防衛費→財政負担"]], "news": [{"date": "2026-11-03", "rank": 31, "head": "日本は「50歳真ん中社会」　25年国勢調査で年齢の中央値が初めて50歳超え、半世紀で約20歳上昇", "ind": "社会", "s": "demo", "c": ["jp"], "t": "mix", "summ": "25年の国勢調査で日本の年齢の中央値が初めて50歳を超えた。半世紀で約20歳上昇し、人口の過半を50歳以上が占める。年齢に関わらず誰もが生き生きと暮らせる社会づくりが欠かせない。"}, {"date": "2026-11-03", "rank": 30, "head": "阪神・佐藤輝明ら3人がポスティング公示　大リーグ移籍市場、新労使協定次第で交渉期限が前倒しも", "ind": "エンタメ", "s": null, "c": ["jp", "us"], "t": "mix", "summ": "大リーグ機構はポスティングシステムで移籍を目指す阪神の佐藤輝明、西武の平良海馬、日本ハムの伊藤大海の3選手を全30球団に通知した。交渉期間は45日間だが、新労使協定が結ばれない場合は12月1日に期限が前倒しになる。"}, {"date": "2026-11-03", "rank": 29, "head": "貴金属の買い取りトラブル、25年度は937件で過去最多　金高騰で強引な勧誘、店舗はクーリングオフ対象外", "ind": "小売", "s": "mideast", "c": ["jp"], "t": "neg", "summ": "国民生活センターへの貴金属などの買い取りに関する相談は25年度に937件と過去最多で、5年で5倍超になった。金の高騰を背景に強引に勧誘され、意に沿わない売却に至るケースが目立つ。店舗買い取りはクーリングオフの対象外だ。"}, {"date": "2026-11-03", "rank": 28, "head": "ピザハット、500円からの低価格ピザを強化　物価高で購入頻度を高める価格帯に人気", "ind": "外食", "s": null, "c": ["jp"], "t": "mix", "summ": "日本ピザハットは2日、「3種チーズのラザニア風ミートソースピザ」を発売した。1人用セット「ピザポテBOX」では500円とし、低価格帯を強化する。持ち帰り価格はSサイズ880円、Mサイズ1300円、Lサイズ1890円に抑えた。"}, {"date": "2026-11-03", "rank": 27, "head": "防災庁が発足、自治体の「弱点」を洗い出し事前防災へ　国民の備蓄はなお4割台", "ind": "建設", "s": null, "c": ["jp"], "t": "pos", "summ": "防災庁が2日に発足した。防災計画を見直し各自治体の防災上の課題を洗い出すほか、全都道府県に国とのパイプ役となる専任職員を置き対策を助言する。国民の災害備蓄はなお4割台にとどまり、緊急要請で備えを促す。"}, {"date": "2026-11-03", "rank": 26, "head": "9月のホテル客室単価は8.8%高の2万657円　訪日客が下支え、民泊大手は23区の規制強化でホテル開発にシフト", "ind": "不動産", "s": null, "c": ["jp"], "t": "pos", "summ": "STRがまとめた9月の国内ホテル平均客室単価は前年同月比8.8%高い2万657円。秋の訪日客需要が押し上げた。民泊国内最大手のマツリテクノロジーズは、4人以上で泊まれる部屋を主体にしたホテルを10カ所以上開業する。"}, {"date": "2026-11-03", "rank": 25, "head": "豪金鉱山大手ノーザンスター、金を5〜7割増産へ　4兆円の買収案を拒否し自力成長", "ind": "資源", "s": "mideast", "c": ["au"], "t": "mix", "summ": "ノーザンスター・リソーシズは処理設備を刷新し新鉱山の開発を検討する。実現すれば30年ごろに生産量は5〜7割増える見通し。約4兆円の買収案を拒否し、自力での企業価値向上を目指す。"}, {"date": "2026-11-03", "rank": 24, "head": "北朝鮮経済、中朝ロの供給網で3%成長　国連制裁前の水準を上回る、ロシア向け武器生産が支え", "ind": "海外", "s": "sec", "c": ["kp", "cn", "ru"], "t": "neg", "summ": "北朝鮮の高成長が続いている。物資やエネルギーを中国とロシアから調達し、軍需品が逼迫するロシア向けの武器を生産する供給網が支える。9月と10月には北朝鮮とロシア、中国を結ぶ自動車用の橋が相次いで開通した。戦争特需に依存し持続性は見通せない。"}, {"date": "2026-11-03", "rank": 23, "head": "イスラエル首相、中間選挙直後のイラン再攻撃をトランプ氏に要求と米報道　トランプ氏は協議を優先", "ind": "海外政治", "s": "mideast", "c": ["il", "ir", "us"], "t": "neg", "summ": "米アクシオスは1日、ネタニヤフ首相がトランプ大統領に中間選挙の直後にイランを再度攻撃するよう求めたと報じた。両首脳は10月31日に電話協議した。トランプ氏はイランとの協議を優先する意向で、双方の立場には隔たりがある。"}, {"date": "2026-11-03", "rank": 22, "head": "IHI、ポーランド原発の格納容器を米WHから受注　新規原発向け機器は10年ぶり", "ind": "エネルギー", "s": "mideast", "c": ["jp", "pl", "us"], "t": "pos", "summ": "IHIはWHから、ポーランドで建設する原発の1号機向け格納容器と鋼製モジュールを受注した。新規原発向けの機器受注は10年ぶり。まず設計と材料調達の先行契約を結び、今後製造して納入する。"}, {"date": "2026-11-03", "rank": 21, "head": "アイシンと東北大、消費電力50分の1の新型半導体を開発　磁気メモリーMRAMを組み込んだSoC", "ind": "半導体", "s": "ai", "c": ["jp"], "t": "pos", "summ": "アイシンは東北大学と、省電力のMRAMを組み込み従来比で消費電力を50分の1に抑えた新型SoC（システム・オン・チップ）を開発したと発表した。AIや画像認識など大容量データ処理の効率化に役立ち、今後実用化を目指す。"}, {"date": "2026-11-03", "rank": 20, "head": "住友化学、純利益48%増の900億円に上方修正　AI向け半導体材料が好調　京セラ・日本触媒も電子材料で攻勢", "ind": "半導体", "s": "ai", "c": ["jp"], "t": "pos", "summ": "住友化学は27年3月期の純利益が前期比48%増の900億円になる見通しで従来予想を200億円上回る。AI需要で半導体材料が想定を上回り、石化市況の好転も寄与する。京セラは4〜9月期の純利益が32%増と製造装置向け部品が好調。日本触媒は互応化学工業を200億円で完全子会社化し半導体材料を強化する。"}, {"date": "2026-11-03", "rank": 19, "head": "住友商事、27年3月期の純利益を6700億円に上方修正　アルミなど資源が好調、中東影響は想定より小さく", "ind": "商社", "s": "mideast", "c": ["jp"], "t": "pos", "summ": "住友商事は27年3月期の連結純利益が前期比12%増の6700億円になる見通しを発表し、従来予想から400億円上方修正した。アルミなど資源が好調で、中東情勢のマイナス影響も想定より小さい。配当は年44円と4円積み増し、株式分割考慮で実質増配となる。"}, {"date": "2026-11-03", "rank": 18, "head": "日本郵船、年間配当330円に引き上げへ　データセンター関連輸送が好調、商船三井も純利益41%増に上振れ", "ind": "海運", "s": "mideast", "c": ["jp"], "t": "pos", "summ": "日本郵船は27年3月期の年間配当を330円前後に引き上げるもよう。従来計画を90円前後上回り、配当利回りは4.5%程度になる。データセンター関連設備の輸送などが好調。商船三井も27年3月期の純利益が41%増に上振れする見通しで、運賃上昇の恩恵を受ける。"}, {"date": "2026-11-03", "rank": 17, "head": "JAL・ANAの4〜9月期は最終減益　燃料費が2社で2300億円増、サーチャージ引き上げでも補えず", "ind": "航空", "s": "mideast", "c": ["jp"], "t": "neg", "summ": "日本の航空大手2社の4〜9月期決算が出そろい、ともに最終減益だった。燃料費は2社合計で前年同期比2300億円増えた。JALの純利益は42%減の390億円と4年ぶりの低水準。JALの鳥取社長は国内線維持へ中堅との関係強化を進める考えを示した。"}, {"date": "2026-11-03", "rank": 16, "head": "マスク氏、米南部で7つの巨大施設　スペースXとテスラ統合をにらみ、AIロボ・車・半導体・エネルギーを総取りへ", "ind": "宇宙", "s": "ai", "c": ["us"], "t": "pos", "summ": "マスク氏は米南部テキサス州などで7つの巨大施設の建設を進めている。AI搭載のロボットや車を軸に、半導体からエネルギーまでを押さえる巨大プラットフォーマーを目指す。スペースXとテスラの統合も視野に入れる。"}, {"date": "2026-11-03", "rank": 15, "head": "金属労協・金子議長、27年春闘で「一段高い視点」　持続的賃上げで成長の好循環目指す", "ind": "人材", "s": "demo", "c": ["jp"], "t": "mix", "summ": "金属労協の金子晃浩議長は日本経済新聞のインタビューで、27年春闘について「一段高い視点で取り組みたい」と述べ、持続的な賃上げで成長の好循環を目指す考えを示した。"}, {"date": "2026-11-03", "rank": 14, "head": "ミスミ、高卒と大卒の初任給を30万円に統一　通年採用で学歴不問、AI時代に課題設定力を重視", "ind": "人材", "s": "demo", "c": ["jp"], "t": "pos", "summ": "ミスミグループ本社は高卒・大卒・既卒の若手を同じ枠で通年採用する制度を11月から始めた。初任給は月30万3000円で統一。学歴ではなく課題設定力や変化への対応力を重視する。"}, {"date": "2026-11-03", "rank": 13, "head": "トラック運賃の下限を国が示す「適正原価制度」、28年にも開始　運送料2割上昇の試算、荷主と消費者に波及", "ind": "物流", "s": "demo", "c": ["jp"], "t": "neg", "summ": "28年6月までに施行されるトラック適正化2法で、国が示す原価を下回る運賃を規制する「適正原価制度」が導入される。運転手への適切な賃金の原資とする狙いで、運賃は2割増えるとの民間試算もある。荷主企業は早期対応が必要で、消費者への影響も避けられない。"}, {"date": "2026-11-03", "rank": 12, "head": "みらい、消費税減税法案に反対方針　物価高対策としての効果を疑問視", "ind": "政治", "s": "rate", "c": ["jp"], "t": "mix", "summ": "政党みらいは消費税減税法案に反対する方針を決めた。物価高対策としての効果を疑問視している。価格への反映は6割にとどまるとの試算もあり、国会審議では実効性と財源が論点になる。"}, {"date": "2026-11-03", "rank": 11, "head": "日本の原子力潜水艦保有に米国で肯定論　アジア広域の対中抑止に役割、人材・財政のハードルは高く", "ind": "防衛", "s": "sec", "c": ["jp", "us", "cn"], "t": "mix", "summ": "日本の原潜保有について米国から肯定的な意見が出ている。海上自衛隊が西太平洋を含むアジア広域で活動しやすくなり中国抑止に役立つとの見方だ。小泉防衛相は10月23日の衆院安全保障委員会で次世代潜水艦の動力に関し「幅広い選択肢について議論する必要がある」と述べた。"}, {"date": "2026-11-03", "rank": 10, "head": "滋賀銀と池田泉州HDの統合は「合併なき再編」　持ち株会社の下で2行独立、激しい金利競争への最適解か", "ind": "金融", "s": "rate", "c": ["jp"], "t": "mix", "summ": "10月29日に発表した滋賀銀行と池田泉州HDの経営統合は持ち株会社の下で傘下2行を独立させる方針。滋賀銀の久保田頭取は「現時点で合併は考えていない」と語った。地域の伝統を守る利点はあるが、統合効果を出し切れるかが問われる。"}, {"date": "2026-11-03", "rank": 9, "head": "SBIHD、4〜9月の純利益39%増の2305億円で過去最高　米デジタル銀行エレボールに1億ドル出資", "ind": "金融", "s": "rate", "c": ["jp", "us"], "t": "pos", "summ": "SBIHDの4〜9月期の純利益は前年同期比39%増の2305億円と同期間で過去最高。収益は17%増の1兆575億円。スタートアップ投資が好調で、国内金利上昇で銀行・証券も伸びた。同日、24時間即時決済のエレボールバンクに約160億円を出資すると発表した。"}, {"date": "2026-11-03", "rank": 8, "head": "金価格が急落、1年ぶり安値の3869ドル　金利低下でも売り、中間選挙後の原油高とインフレ再加速に警鐘", "ind": "マーケット", "s": "mideast", "c": ["us"], "t": "mix", "summ": "ロンドン現物は10月30日に一時前日比4%近く下げ、1トロイオンス3869ドルと25年10月以来1年ぶりの安値をつけた。金利低下でも売りが続く変調は、中間選挙後に原油が高騰しインフレ再加速で米利上げ圧力が強まるシナリオへの警鐘とされる。"}, {"date": "2026-11-03", "rank": 7, "head": "「動かぬ円」再び、10月の値幅は4年半ぶりの小ささ　ヘッジファンドの円売りが一巡、構造的な円売りは残る", "ind": "為替", "s": "rate", "c": ["jp", "us"], "t": "mix", "summ": "10月の円相場の対ドルの変動幅は4年半ぶりの小ささとなった。デジタル赤字など構造的な円売りが残る一方、26年度前半の円安を演出したヘッジファンドの動きが落ち着いた。市場参加者からは「取引量が圧倒的に少ない」との声が上がる。"}, {"date": "2026-11-03", "rank": 6, "head": "アンソロピックIPO、日本で最大5528億円を調達　スペースXを6割上回り海外企業として過去最大", "ind": "IT・AI", "s": "ai", "c": ["us", "jp"], "t": "pos", "summ": "アンソロピックは2日、IPOで最大35億ドル（約5528億円）を日本で調達すると発表した。関東財務局に提出した有価証券届出書で明らかにした。みずほ証券が取りまとめ、ゴールドマン・サックス、三菱UFJモルガン・スタンレー、モルガン・スタンレーMUFG、楽天、SBIの各証券でも購入できる。"}, {"date": "2026-11-03", "rank": 5, "head": "中国BYD、10月の新車販売11%増の49万台　EVは4割増、輸出は2倍に", "ind": "海外", "s": "china", "c": ["cn", "th"], "t": "neg", "summ": "BYDの10月の新車販売は前年同月比11%増の49万168台。EVが37%増の30万5743台、PHVは17%減の17万7382台だった。海外での新型車投入を増やし、輸出は2倍になった。"}, {"date": "2026-11-03", "rank": 4, "head": "10月の国内新車販売は3%減の38万台、7カ月ぶりマイナス　軽自動車が苦戦、登録車は1%増", "ind": "自動車", "s": "rate", "c": ["jp"], "t": "neg", "summ": "10月の国内新車販売（軽含む）は前年同月比3%減の38万1756台と7カ月ぶりに前年を下回った。ダイハツやスズキなど軽主力メーカーの販売減が目立ち、登録車は1%増の24万9180台だった。"}, {"date": "2026-11-03", "rank": 3, "head": "自動運転車「ハンドル無し」を一律認定へ　レベル4以上、国交省が12月から保安基準を適用　ロボタクシー量産を後押し", "ind": "自動車", "s": "demo", "c": ["jp"], "t": "pos", "summ": "国土交通省はハンドルやブレーキペダルのない車両を一律に認定する方向で保安基準を見直し、12月以降の生産車に適用する方針。4日の車両安全対策検討会で議論する。自動運転タクシーの普及を見据え量産化を後押しする。"}, {"date": "2026-11-03", "rank": 2, "head": "サイバー防衛、制度が追いつかず　「能動的サイバー防御」の前倒し求める声　AI攻撃にはソフトの耐性基準を", "ind": "政策", "s": "bloc", "c": ["jp"], "t": "mix", "summ": "与野党や有識者から、政府の同意なき情報取得の前倒しや国の体制強化を求める声が上がる。識者はAIによる攻撃に備え、国がソフトウエアに耐性基準を設けるべきだと提言する。"}, {"date": "2026-11-03", "rank": 1, "head": "サイバー保険の問い合わせ3倍に　GMO問題などで危機感、中小企業でも関心　保険料上昇の懸念も", "ind": "金融", "s": "bloc", "c": ["jp"], "t": "mix", "summ": "東京海上日動ではサイバー保険の契約企業からの専用窓口への相談が10月、4〜9月の月平均の3倍に増えた。損保各社は事前に被害を減らす診断・支援を強化する。大型事故が続けば保険料の上昇につながるとの懸念もある。"}, {"date": "2026-11-03", "rank": 0, "head": "GMO不正アクセス、警視庁が捜査本部設置　24年4月に脆弱性を把握しながら抜本解決できず、150社傘下の複雑な統治が防御を後手に", "ind": "通信・IT", "s": "bloc", "c": ["jp"], "t": "neg", "summ": "熊谷正寿会長兼社長は2日の会見で、24年4月にシステムの欠陥（脆弱性）を把握しながら抜本解決に至らず、発覚の遅れと被害拡大を招いたと説明し「私が介在すべきだった」と述べた。警視庁は捜査本部を設置。同社は発行済み株式の16%にあたる自己株1712万株の消却も発表した。"}, {"date": "2026-11-04", "rank": 30, "head": "決済代行の全東信破綻、売上金が宙に浮いた飲食店　逆境を機に店舗DXが動き出す", "ind": "決済・外食", "s": "sec", "c": ["jp"], "t": "neg", "summ": "東京・錦糸町の鮨店では約70万円の売上金が宙に浮き、客の8割弱がカード払いのため予約キャンセルも相次いだ。被害を受けた飲食店では、決済手段の分散や予約・会計のデジタル化に動く例が出ている。"}, {"date": "2026-11-04", "rank": 29, "head": "アップル、iPhoneは「高価格機種頼み」の年末商戦　日本では最低20万円超の機種のみ、半導体の供給制約で成長鈍化", "ind": "IT・家電", "s": "ai", "c": ["us", "jp"], "t": "neg", "summ": "アップルは10〜12月期にiPhone標準モデルの新製品を出さず、日本では最低20万円超の高額機種のみとなる。半導体の供給制約も響き、全社の世界での成長率は鈍る見通し。新CEOにとって初の年末商戦になる。"}, {"date": "2026-11-04", "rank": 28, "head": "英国、永住権取得に必要な滞在年数を5年から10年に　EU離脱後の移民急増で厳格化、医療従事者は据え置き", "ind": "海外", "s": "demo", "c": ["gb"], "t": "neg", "summ": "英政府は一般労働者の移民が永住権を申請するために必要な滞在年数を2027年に5年間から10年間に延ばすと発表した。医療従事者らは5年間で据え置き優遇する。"}, {"date": "2026-11-04", "rank": 27, "head": "私大の公立化で問われる地元貢献　千歳科技大は半導体人材をラピダスへ送り出す", "ind": "教育・人材", "s": "demo", "c": ["jp"], "t": "mix", "summ": "2019年度に公立化した公立千歳科学技術大学は、地元の半導体産業の期待を受けて人材育成を強化し、ラピダスへ人材を送り出している。公立化後に地元にどう貢献するかが試されている。"}, {"date": "2026-11-04", "rank": 26, "head": "エムスリー、4〜9月の純利益12%減　製薬向けマーケティング支援が低調　医師の51%は治療法選択に生成AIを活用", "ind": "ヘルスケア", "s": "ai", "c": ["jp"], "t": "neg", "summ": "エムスリーの4〜9月期の純利益は前年同期比12%減の199億円だった。売上収益は6%増の1818億円で、医療DX支援や治験支援が伸びた。デロイトトーマツの調査では国内医師の51%が治療法選択の情報収集に生成AIを使い、がん領域で特に多かった。"}, {"date": "2026-11-04", "rank": 25, "head": "アイフル、インドネシアの中古商用車ローン会社を40億円で買収　既存の事業基盤を強化", "ind": "金融", "s": "china", "c": ["jp", "id"], "t": "pos", "summ": "ムニノバHDは傘下のアイフルを通じ、インドネシアで中古商用車向けローンを手がけるマルティンド・オートファイナンスを約40億円で買収したと発表した。同社の25年12月期の総資産は約97億円。アイフルが同国で築いた基盤を強化する。"}, {"date": "2026-11-04", "rank": 24, "head": "九州大学、次世代造船の産学官組織を設立　大島造船所など36者が参加し研究開発と人材育成", "ind": "造船", "s": "sec", "c": ["jp", "cn", "kr"], "t": "pos", "summ": "九州大学は次世代造船業の研究開発や人材育成を担う産学官組織を設立した。地場大手の大島造船所など36者が参加する。設計のデジタル化や新燃料船の開発、技術者の育成を進める。"}, {"date": "2026-11-04", "rank": 23, "head": "陸自、30年度にも対艦・対空・地上の射撃指揮システムを統合　富士通中心に離島防衛の指揮を迅速化、概算要求179億円", "ind": "防衛", "s": "sec", "c": ["jp", "cn"], "t": "pos", "summ": "陸自は2030年度にも、ミサイルや砲弾の射撃を師団レベルで指揮するシステムを統合する。富士通が中心となって統合し、防衛省は27年度予算の概算要求で179億円以上の関連費用を計上した。判断を迅速にし、砲弾の消耗も抑える。"}, {"date": "2026-11-04", "rank": 22, "head": "公明党、消費税減税法案に衆院で反対の方向で調整　2年限定の効果を疑問視、所得連動の新給付の設計も示されず", "ind": "財政・政治", "s": "rate", "c": ["jp"], "t": "mix", "summ": "公明党は衆院採決で反対する方向で調整に入った。2年限定の減税は物価高対策として効果が低いと判断したほか、政府が所得連動型給付の制度設計を明示していないことを踏まえた。一方、共産党は参政党が出した消費税一律5%の法案に賛成するという異例の一致も起きた。"}, {"date": "2026-11-04", "rank": 21, "head": "香港GDP、7〜9月は5.2%増に加速　AIデータセンター向けの中国製電子機器の輸出が好調", "ind": "海外", "s": "china", "c": ["hk", "cn"], "t": "pos", "summ": "香港政府は7〜9月期の実質GDP（速報値）が前年同期比5.2%増だったと発表した。4〜6月期の4.2%から加速し、季節調整済み前期比でも1.9%増だった。消費も底堅く、通年では政府予想から上振れする可能性が高まった。"}, {"date": "2026-11-04", "rank": 20, "head": "ユーロ圏の10月消費者物価4.0%上昇、4カ月連続で加速　中東情勢でエネルギー高、コアは2.5%で横ばい", "ind": "海外", "s": "rate", "c": ["eu"], "t": "neg", "summ": "EU統計局によると、ユーロ圏の10月の消費者物価指数（速報値）は前年同月比4.0%上昇し、9月の3.8%から伸びが加速した。エネルギー・食品などを除くコアは2.5%で横ばいだった。市場予想と同水準。"}, {"date": "2026-11-04", "rank": 19, "head": "豪中銀、政策金利を4.85%に引き上げ　2会合連続・今年5回目で18年ぶり水準、エネルギー高とAI投資でインフレ加速", "ind": "海外", "s": "rate", "c": ["au"], "t": "neg", "summ": "オーストラリア準備銀行は政策金利を0.25%引き上げ4.85%にした。利上げは2会合連続で、18年ぶりの高水準。声明で「多くの商品・サービスでインフレ率が高止まりしている」と指摘した。"}, {"date": "2026-11-04", "rank": 18, "head": "トランプ氏、中間選挙直後のイラン再攻撃を否定「急いでいない」　バンス副大統領も交渉を明言、水面下の協議を優先", "ind": "海外政治", "s": "mideast", "c": ["us", "ir", "il"], "t": "mix", "summ": "トランプ氏は2日、中間選挙後にイランへの空爆を再開するかを記者団に問われ「いいえ」と否定した。アクシオスの取材にも戦闘再開を「急いでいない」と述べ、水面下で進む交渉を見守る姿勢を示した。バンス副大統領も交渉を明言した。"}, {"date": "2026-11-04", "rank": 17, "head": "サウジアラムコ、7〜9月の純利益35%増の362億ドル　原油高で4年ぶり高水準、ホルムズ通航は不安定続く", "ind": "エネルギー", "s": "mideast", "c": ["sa", "ir", "us"], "t": "mix", "summ": "アラムコの7〜9月期の純利益は前年同期比35%増の362億ドル（約5兆7200億円）で、四半期として4年ぶりの高水準だった。原油高が寄与した。一方、トランプ氏は中間選挙直後のイラン空爆再開を否定し、バンス副大統領も交渉を明言した。"}, {"date": "2026-11-04", "rank": 16, "head": "キーコーヒー、価格改定と独自商品で増収増益続く　生豆高騰・円安で低迷したROEの改善を急ぐ", "ind": "食品", "s": "china", "c": ["jp", "br"], "t": "mix", "summ": "柴田裕社長は豆相場の高騰に合わせて価格改定を進めたことで収益が改善したと述べた。25年発売の新商品など付加価値の高い商品の投入や産地支援でブランド力を強化し、ROEの改善を目指す。"}, {"date": "2026-11-04", "rank": 15, "head": "ヤマトHD、宅急便で大口顧客の運賃を値上げへ　「値段を下げてまで取らない」、拠点は減らしても個人の利便性は維持", "ind": "物流", "s": "demo", "c": ["jp"], "t": "mix", "summ": "桜井敏之社長は日本経済新聞の取材に、大口顧客との運賃交渉で値上げを目指す方針を示した。拠点の削減を進めるが、個人客の利便性は維持するとした。株価は年初来高値に接近した。"}, {"date": "2026-11-04", "rank": 14, "head": "トヨタ系の東海興業、日産系の鬼怒川ゴムを買収　中国勢の台頭で「ケイレツ」超えの部品再編", "ind": "自動車", "s": "china", "c": ["jp", "cn"], "t": "mix", "summ": "東海興業HDは鬼怒川ゴム工業HDの全株式を日本政策投資銀行などから取得し完全子会社化した。取得金額は非公開。トヨタ系と日産系の部品メーカーが一体となり、調達や生産の合理化を進める。"}, {"date": "2026-11-04", "rank": 13, "head": "東京ディズニー、学生向け入園料を最大1000円割引　「キャンパスデーパスポート」を3年ぶりに発売、若年層の来園を取り込む", "ind": "レジャー", "s": "demo", "c": ["jp"], "t": "mix", "summ": "オリエンタルランドは中学生以上の学生を対象に、2027年1月4日〜3月19日に使える最大1000円引きのチケットを発売した。販売は3年ぶりで、春休みなどの閑散期に若年層を取り込む。"}, {"date": "2026-11-04", "rank": 12, "head": "韓国HYBE、7〜9月期の売上高・営業益が過去最高　BTSの世界ツアーで売上2.1倍、「BTS依存」は一段と", "ind": "エンタメ", "s": "china", "c": ["kr", "jp"], "t": "pos", "summ": "HYBEの7〜9月期の売上高は前年同期比2.1倍の1兆5256億ウォン（約1800億円）、営業損益は1885億ウォンの黒字に転換した。いずれも四半期で過去最高。ツアーのチケット・グッズ収入が寄与した。東京市場ではAI株安の中でコンテンツ株が逆行高となった。"}, {"date": "2026-11-04", "rank": 11, "head": "ドコモ、27年3月期に個人向け通信が増収へ　12月の値上げが寄与し純利益は3%減に上方修正、顧客離れの懸念も", "ind": "通信", "s": "demo", "c": ["jp"], "t": "mix", "summ": "ドコモは27年3月期の連結純利益が前期比3%減の6410億円になりそうだと発表し、従来予想から140億円上方修正した。営業収益は6%増を見込む。値上げなどで本業の個人向け通信は増収に転じる見通しだが、販促費や品質投資が膨らみ収益力の回復は途上。NTT株は業績引き上げが市場予想に届かず下げ幅を広げた。"}, {"date": "2026-11-04", "rank": 10, "head": "商社4社が27年3月期を上方修正、三菱商事は最高益見通しで最大1兆円の自社株買い　資源高が追い風、三井物産も1兆円超", "ind": "商社", "s": "mideast", "c": ["jp", "sa"], "t": "pos", "summ": "大手5社の4〜9月期決算が4日に出そろい、伊藤忠商事を除く4社が通期純利益予想を上方修正した。三菱商事や丸紅が最高益を見込み、三井物産も1兆円を超える。三菱商事は最大1兆円の自社株買いに踏み切る。三井物産の社長は資源・エネルギーで長期案件も検討すると述べたが、株価は上方修正後も売りに押された。"}, {"date": "2026-11-04", "rank": 9, "head": "地銀13行がサイバー防衛で共同戦線　九州・沖縄・山口でPT発足、システム調達や人材育成で協力", "ind": "金融", "s": "sec", "c": ["jp"], "t": "pos", "summ": "福岡銀行や沖縄銀行など九州・沖縄、山口の地銀13行は11月、サイバーセキュリティーに関するプロジェクトチームを立ち上げる。システムの共同調達や人材育成、情報共有で協力し、地域の取引先企業の防御支援も視野に入れる。"}, {"date": "2026-11-04", "rank": 8, "head": "三菱UFJ、新銀行でキャッシュカード全廃　セブン銀行と提携しスマホで入出金、認証を複数にしてサイバー犯罪に備える", "ind": "金融", "s": "sec", "c": ["jp"], "t": "pos", "summ": "新銀行ではキャッシュカードを発行せず、セブン銀行のATMでスマートフォンを使って預金を引き出せるようにする。認証方法を複数にして安全性を高める。半世紀続いた預金の出し入れの形が変わる転機になる。"}, {"date": "2026-11-04", "rank": 7, "head": "無印良品の「MUJIカード」会員109万件、カード番号全桁が流出の恐れ　クレディセゾン発行、21年7月までの入会者", "ind": "小売", "s": "sec", "c": ["jp"], "t": "neg", "summ": "良品計画はMUJIカード会員の個人情報約109万件が流出した可能性があると発表した。2021年7月までに入会した会員のカード番号全桁、ID、生年月日などが漏れた恐れがある。セキュリティーコードやカード名義は流出していないとしている。"}, {"date": "2026-11-04", "rank": 6, "head": "メール配信「アララ」に不正アクセス、モス750万件・成城石井・JR九州など流出拡大　乗っ取られた基盤から詐欺メール713万通", "ind": "通信・IT", "s": "sec", "c": ["jp"], "t": "neg", "summ": "モスフードサービスは約750万件の会員情報が流出したと発表し、成城石井（最大16万件）、JR九州（最大1万3000件）、ソラシドエア（約49万件）、ヤクルト、福岡市などにも被害が広がった。攻撃者は配信基盤そのものを悪用し、ビックカメラなどの顧客に約713万通の不審なメールを送った。住友不動産やデニーズでも別経路の流出が"}, {"date": "2026-11-04", "rank": 5, "head": "アンソロピック、7〜9月の売上高12倍の169億ドル　パランティアは民間売上高が政府向けを初めて逆転、96%増収", "ind": "IT・AI", "s": "ai", "c": ["us", "jp"], "t": "pos", "summ": "アンソロピックの7〜9月の売上高は前年同期の12.3倍の169億5600万ドルで、目論見書の更新版に計算資源への投資額を追記した。パランティアの7〜9月は売上高が96%増の23億1341万ドル、純利益は2.4倍の11億ドルで、民間向けが政府向けを初めて上回った。"}, {"date": "2026-11-04", "rank": 4, "head": "米マーベル、光部品のルメンタムを18兆円で買収　AIデータセンターの光接続を取り込む", "ind": "半導体", "s": "ai", "c": ["us", "cn"], "t": "pos", "summ": "マーベルは株式交換方式でルメンタムを買収し、企業価値を約1150億ドル（約18兆円）と見積もった。2028年上半期の完了を見込む。株式価値ベースでもスペースXによるxAI買収に次ぐ規模とされ、AIの「つなぐ技術」をめぐる大型再編となる。"}, {"date": "2026-11-04", "rank": 3, "head": "米テック5社の「影の債務」が505兆円、半年で9割増　データセンター賃借など将来債務が膨張、社説も「巨額AI投資の成果示せ」", "ind": "IT・AI", "s": "ai", "c": ["us"], "t": "neg", "summ": "アルファベット、メタ、マイクロソフト、アマゾン、オラクルの5社のAI関連の将来債務は約3兆2000億ドル（約505兆円）と半年で9割増えた。巨額投資は新興AI企業の資金調達も支えてきたが、主力事業が減速したアルファベット株が急落するなど市場は先行投資のリスクに敏感になっている。"}, {"date": "2026-11-04", "rank": 2, "head": "三井化学、JSRを1.3兆円超で買収へ　政府系JICから株式の大半、国内化学M&Aで過去最高額　住友ベークも封止材で47%増益", "ind": "化学・半導体", "s": "ai", "c": ["jp"], "t": "pos", "summ": "JICは三井化学をJSR売却先の優先交渉権者に選んだ。三井化学は1兆3000億円以上で株式の大半を買い取る方針で、国内化学業界のM&Aで過去最高額になる。同日、住友ベークライトは4〜9月の純利益が47%増の195億円と発表し、AIサーバー向け半導体封止材が伸びた。"}, {"date": "2026-11-04", "rank": 1, "head": "日経平均893円安の6万2188円、3カ月ぶり安値　米民主の勝利で「AI規制」を警戒、一時3000円超下げ6万円割れに迫る", "ind": "マーケット", "s": "ai", "c": ["jp", "tw", "kr"], "t": "neg", "summ": "4日の日経平均は3日続落し、893円安の6万2188円で取引を終えた。下げ幅は一時3000円を超え、6万円割れに迫った。アドバンテストやソフトバンクGなどAI関連が売られ、台湾株・韓国株も一時4%安と半導体に売りが広がった。一方でコンテンツ株は逆行高となった。"}, {"date": "2026-11-04", "rank": 0, "head": "米中間選挙、民主党が上下両院で多数派奪還　トランプ共和党は大敗、上院・知事選も「赤い州」で民主が相次ぎ勝利", "ind": "海外政治", "s": "bloc", "c": ["us"], "t": "mix", "summ": "民主党が下院に加え上院でも多数派を奪還し、共和党は大敗した。上院選・知事選では共和地盤の「赤い州」でも民主が勝利し、激戦6州で勝利を確実にした。有権者調査では若年層と中低所得層の民主への流出が鮮明で、トランプ氏は結果を「受け入れる」と米紙に語った。"}, {"date": "2026-11-05", "rank": 31, "head": "ウクライナ・米国・ロシア、エネルギー施設への攻撃停止を協議へ　10〜11日にUAEで2月以来の3カ国実務者協議", "ind": "海外", "s": "sec", "c": ["ua", "ru", "ae"], "t": "mix", "summ": "ゼレンスキー大統領は3日、UAEで10〜11日に開くウクライナ・米国・ロシアの3カ国実務者協議で、両国のエネルギー関連施設への攻撃停止が議題になるとの見通しを示した。訪問先のベルリンでの記者会見で語った。"}, {"date": "2026-11-05", "rank": 30, "head": "26年上半期の出生数、11年ぶりに前年上回る　0.4%増の32万458人、コロナ後の婚姻数持ち直しが影響か", "ind": "人口・労働", "s": "demo", "c": ["jp"], "t": "pos", "summ": "厚生労働省は4日、26年1〜6月の日本人の出生数が32万458人で前年同期を0.4%上回ったと発表した。同期間で前年を上回るのは11年ぶり。コロナ禍で落ち込んだ婚姻数が25年までに持ち直したことが影響した可能性がある。"}, {"date": "2026-11-05", "rank": 29, "head": "東京都内の募集家賃が7.4%上昇、7%台の伸び続く　23区の建売住宅は1年で2割高、共働き世帯が高額物件に", "ind": "不動産", "s": "rate", "c": ["jp"], "t": "mix", "summ": "内閣府は4日、7〜9月期の東京都内の募集家賃指数が前年同期比7.4%上昇したと公表した。指数は130.1で、7%台の伸びが続く。東京23区では1億円を超える建売住宅が増え、平均価格は1年で2割上がった。購入時の手間を抑えやすい点が共働き世帯に支持されている。"}, {"date": "2026-11-05", "rank": 28, "head": "住友林業、26年12月期の経常益を47%減の925億円に下方修正　米国の住宅ローン金利高止まりで主力の米住宅が低迷", "ind": "不動産・住宅", "s": "rate", "c": ["jp", "us"], "t": "neg", "summ": "住友林業は5日、26年12月期の連結経常利益が前期比47%減の925億円になりそうだと発表した。従来予想から225億円引き下げた。売上高は23%増の2兆7800億円、営業利益は26%減の1250億円を見込む。"}, {"date": "2026-11-05", "rank": 27, "head": "大成建設、1400トンのシールドマシンをAIで自動運転　誤差2ミリ未満、熟練運転士を上回る精度に", "ind": "建設", "s": "demo", "c": ["jp"], "t": "pos", "summ": "大成建設はトンネルを掘る巨大重機「シールドマシン」でAIによる自動運転に成功した。地中は場所によって硬さが異なり直進させるだけでも繊細な技術が必要で、当初のシステムでは導入を見送った経緯がある。改善を重ね、熟練運転士を上回るレベルになった。"}, {"date": "2026-11-05", "rank": 26, "head": "「ゴジラ-0.0」初日興行収入9.1億円、実写映画で歴代1位　前作の2倍超で動員59万人、IMAX基準で制作", "ind": "エンタメ", "s": null, "c": ["jp", "us"], "t": "pos", "summ": "東宝は4日、3日に公開された「ゴジラ-0.0」の初日興行収入が実写映画で最高の9.1億円だったと発表した。初日興収は前作の2倍超で、観客動員数は59万人を突破した。大型画面・音響の上映システム「IMAX」基準で撮影・制作した。"}, {"date": "2026-11-05", "rank": 25, "head": "中国格安EC「Temu」に関税の逆風、利用者は5カ月連続で減少　欧米の小口輸入課税で割高に、ブランド育成へ転換", "ind": "中国", "s": "china", "c": ["cn", "de", "us"], "t": "neg", "summ": "米調査会社によるとTemuのアプリ利用者数は5カ月連続で減少した。欧米などで小口輸入品が関税の対象となり割高になったためだ。付加価値の高いブランド商品の育成に乗り出すなど、ビジネスモデルの転換を急ぐ。"}, {"date": "2026-11-05", "rank": 24, "head": "百貨店の27年福袋が出そろう　物価高と27年4月の食品減税を見据え、松屋は3000円値下げ・高島屋は冷凍庫セット", "ind": "小売", "s": null, "c": ["jp"], "t": "mix", "summ": "主要百貨店の27年の福袋が4日に出そろった。松屋は生鮮品や総菜の福袋を3000円分値下げし、高島屋は食品減税で冷凍食品の需要が増えるとみて冷凍庫と冷凍食品のセットを用意した。"}, {"date": "2026-11-05", "rank": 23, "head": "ユニクロ、10月の国内既存店売上高5.5%減　気温が高く冬物が苦戦、客数は5カ月連続減", "ind": "小売", "s": null, "c": ["jp"], "t": "neg", "summ": "ファーストリテイリングのユニクロの10月の国内既存店売上高（EC含む）は前年同月比5.5%減と2カ月ぶりに前年を下回った。10月後半に気温が高く冬物商品の販売が苦戦した。客数は9.8%減と5カ月連続のマイナスだった。"}, {"date": "2026-11-05", "rank": 22, "head": "東洋水産、4〜9月期の純利益11%増の371億円　即席麺の値上げでコスト上昇を吸収、海外即席麺は24%増益", "ind": "食品", "s": null, "c": ["jp", "us", "mx"], "t": "pos", "summ": "東洋水産の4〜9月期の純利益は前年同期比11%増の371億円だった。即席麺の値上げで原材料や製造経費の上昇を吸収し、円安で海外収益の円換算額も膨らんだ。売上高は7%増の2740億円、海外即席麺事業の営業利益は24%増の357億円だった。"}, {"date": "2026-11-05", "rank": 21, "head": "アステラス製薬、27年3月期の純利益を20%増の3500億円に上方修正　抗がん剤が伸びコスト抑制も寄与", "ind": "製薬", "s": null, "c": ["jp", "us"], "t": "pos", "summ": "アステラスは4日、27年3月期の純利益が前期比20%増の3500億円になる見通しだと発表した。従来予想から500億円上方修正した。主力製品の伸びとコスト抑制が寄与する。"}, {"date": "2026-11-05", "rank": 20, "head": "三菱重工、フランス電力に原発向け蒸気発生器3基を納入　世界的な原発回帰で需要増、生産できる企業は限られる", "ind": "重工", "s": null, "c": ["jp", "fr"], "t": "pos", "summ": "三菱重工業はフランス電力公社（EDF）に原子力発電所向けの蒸気発生器3基を納入したと発表した。蒸気発生器は高さ約21メートルで原子炉の熱をタービンに伝える重要機器。高い耐久性が求められ、世界でも生産できる会社は限られる。"}, {"date": "2026-11-05", "rank": 19, "head": "英シェル、豪州のLNG権益を中東の投資会社に2300億円で売却　非操業権益を手放し中核事業に集中", "ind": "エネルギー", "s": "mideast", "c": ["gb", "au"], "t": "mix", "summ": "シェルは3日、豪州北西部沖のLNGプロジェクト「ノースウエスト・シェルフ」の16.67%の非操業権益を中東の投資会社に売却すると発表した。取引額は14億5000万ドル（約2300億円）。"}, {"date": "2026-11-05", "rank": 18, "head": "秋の「端境期」に電力需給の逼迫が相次ぐ　寒暖差で需要が拡大、定期点検と重なりスポット価格が急騰", "ind": "エネルギー", "s": "ai", "c": ["jp"], "t": "neg", "summ": "寒暖差の大きい日が多く電力需要が拡大し、発電設備の定期点検も重なって供給余力が低下した。10月20日早朝には日本卸電力取引所（JEPX）の北海道エリアなどでスポット価格が跳ね上がった。富山県と関西電力は黒部川第四発電所の水力電力を県内に供給する体制をつくり、データセンター誘致につなげる。"}, {"date": "2026-11-05", "rank": 17, "head": "経済安保の重要技術支援に3類型　南鳥島沖レアアースや高感度センサーを想定、Kプログラムを柔軟化", "ind": "政策", "s": "bloc", "c": ["jp"], "t": "pos", "summ": "内閣府は4日、Kプログラムの改革案を自民党の会合で示した。重要技術を規模や実装の加速といった3類型に分け、進捗や技術動向にあわせて柔軟に支援できるようにする。小笠原諸島・南鳥島沖のレアアース開発や高感度センサーなどを想定する。"}, {"date": "2026-11-05", "rank": 16, "head": "小泉防衛相「有事見据え予備生産力を」　防衛産業基盤戦略を12月に策定、米国では民主勝利で防衛株に逆風", "ind": "防衛", "s": "sec", "c": ["jp", "us"], "t": "pos", "summ": "防衛省と経済産業省は4日、防衛産業の新戦略策定に向け産業界と意見交換した。小泉防衛相は「有事を見据えた予備生産力を有する状態に変革することが必要だ」と述べ、財政支援による増産を念頭に置く。一方、米市場では民主党の勝利で軍事費拡大の追い風が弱まるとみて防衛関連株が売られた。"}, {"date": "2026-11-05", "rank": 15, "head": "自民党、国民民主党の連立参加へ布石　衆院定数削減やガソリン補助縮小で主張を取り入れ、参院に消費税特別委", "ind": "財政・政治", "s": null, "c": ["jp"], "t": "mix", "summ": "自民党は衆院定数の削減やガソリン補助の縮小で国民民主の主張を相次いで取り入れた。27年秋の総裁選後を見据えた連立拡大の布石との見方が出ている。参院は消費税特別委員会の設置を決め、委員の過半は野党が占める。"}, {"date": "2026-11-05", "rank": 14, "head": "財制審、医療の窓口負担「年齢によらず原則3割を」　金融所得の反映対象を65歳以上に拡大も要望", "ind": "財政・政治", "s": null, "c": ["jp"], "t": "mix", "summ": "財政制度等審議会の分科会は4日、医療費の窓口負担について「年齢によらず原則3割を目指すべきだ」と提起した。金融所得の反映対象を65歳以上に広げることも求めた。美容医療機関から負担金を徴収し、地方の医療人材の確保に充てる案も示した。"}, {"date": "2026-11-05", "rank": 13, "head": "「LINE」有料会員が1000万人を突破、1年で2倍　送信取り消しなどの機能が支持され国内最大級のサブスクに", "ind": "通信", "s": null, "c": ["jp"], "t": "pos", "summ": "LINEの有料プランの会員数が9月末時点で1090万人となり、前年から2倍に増えた。送信取り消しなど機能の拡充が支持を広げた。サブスクリプションでは国内最大規模とみられ、新たな収益源に育てる。"}, {"date": "2026-11-05", "rank": 12, "head": "アララ不正アクセスの被害が金融に拡大　松井証券83万件・朝日生命・楽天証券でメール流出、ソニー銀は委託先経由で621件", "ind": "金融", "s": null, "c": ["jp"], "t": "neg", "summ": "松井証券は顧客のメールアドレス最大83万件、朝日生命は約1.9万件、楽天証券は2109件の漏洩を発表した。いずれもアララへの不正アクセスが原因で、ログインIDや取引情報は含まれていない。ソニー銀行もデジタル証券の委託先システムへの不正アクセスで621件の個人情報が流出し、一部は口座番号も漏れた。"}, {"date": "2026-11-05", "rank": 11, "head": "政府、未知の脆弱性情報を米テックから早期入手へ　サイバー緊急対策パッケージ、6日の関係閣僚会議で提示", "ind": "通信・サイバー", "s": "sec", "c": ["jp", "us"], "t": "pos", "summ": "政府がまとめるサイバー緊急対策パッケージ案の概要が判明した。高性能AIの開発などを手がける米国中心の海外テック大手から、公表されていない未知の脆弱性情報を早期に入手する仕組みをつくる方針を明記する。重要インフラへの攻撃への即応性を高める。"}, {"date": "2026-11-05", "rank": 10, "head": "豪Canva、創業以来初の人員削減　従業員の22%・約1270人に影響、生成AIの普及で成長が10年ぶり鈍化", "ind": "IT・AI", "s": "ai", "c": ["au"], "t": "neg", "summ": "Canvaは4日、創業以来初の人員削減を発表した。従業員の22%にあたる約1270人に解雇や職務変更などの影響が及ぶ。パーキンスCEOは従業員への書簡で「今年はこれまでで最も厳しい年」とし、成長が10年ぶりに鈍化したと説明した。"}, {"date": "2026-11-05", "rank": 9, "head": "米AMD、10〜12月の売上高66%増の170億ドル見通し　AI向け半導体が好調で市場予想を上回る", "ind": "半導体", "s": "ai", "c": ["us"], "t": "pos", "summ": "AMDは3日、26年10〜12月期の売上高が前年同期比66%増の170億ドル（約2兆7000億円）程度になる見通しを示した。事前の市場予想平均（約163億ドル）を上回り、時間外取引で株価は一時9%上昇した。"}, {"date": "2026-11-05", "rank": 8, "head": "マーベル18兆円買収の背後にエヌビディア　売り手と買い手の双方に出資、メタも社債で2.4兆円調達し上乗せ金利は拡大", "ind": "IT・AI", "s": "ai", "c": ["us"], "t": "mix", "summ": "マーベルとルメンタムの巨額買収の背後には、売り手と買い手の双方に資金を供給して企業価値を押し上げ、AI経済圏を下支えするエヌビディアの存在が浮かぶ。メタは3日、社債発行で150億ドル（約2兆4000億円）を調達したが、投資回収の不確実性を織り込み金利の上乗せ幅は拡大した。"}, {"date": "2026-11-05", "rank": 7, "head": "日本生命、米生保コアブリッジに590億円追加出資　合併後も持ち分法を維持、プルデンシャルは日本事業25%減益", "ind": "保険", "s": "rate", "c": ["jp", "us"], "t": "pos", "summ": "日本生命は4日、米コアブリッジ・ファイナンシャルに3億7600万ドル（約590億円）を追加出資したと発表した。26年内にも予定する米エクイタブルとの合併後も持ち分法適用会社とする。米プルデンシャルは7〜9月期の日本事業の利益が25%減り、プルデンシャルHDは金銭詐取の防止へ改善諮問委員会を設けた。"}, {"date": "2026-11-05", "rank": 6, "head": "三菱UFJと三井住友、ニデックの融資枠計6000億円を更新　会計不正で再建中、契約期限は1年", "ind": "金融", "s": null, "c": ["jp"], "t": "mix", "summ": "三菱UFJ銀行と三井住友銀行は、ニデックに対する計6000億円を上限とする融資枠（コミットメントライン）の契約を更新する。期限は27年11月までの1年間。融資枠があれば機動的に資金を借りられ、取引先の信頼維持につながる。"}, {"date": "2026-11-05", "rank": 5, "head": "ゆうちょ銀行、松井証券に約20%出資し筆頭株主に　貯金口座からアプリで株売買、銀証連携で資産形成を強化", "ind": "金融", "s": null, "c": ["jp"], "t": "pos", "summ": "ゆうちょ銀行と松井証券は4日、資本提携を発表した。ゆうちょ銀が創業家系の会社から約20%の株式を取得して単独の筆頭株主となり、持ち分法適用会社とする。ゆうちょの貯金口座利用者がアプリで株式を売買できるようにする。なお松井証券は5日、メール配信委託先のアララへの不正アクセスで顧客のメールアドレス最大83万件が漏洩したと発"}, {"date": "2026-11-05", "rank": 4, "head": "日産、北米の高級車ブランドでHVに再参入へ　株価は51年ぶり安値で「小型株化」も意識", "ind": "自動車", "s": "china", "c": ["jp", "us"], "t": "neg", "summ": "日産は北米の高級車ブランドでHVに再参入し、30年までに小型SUVなどで車種を増やす方針を明らかにした。一方、株価は4日に1975年11月以来51年ぶりの低水準に沈み、リーマン・ショック後の安値を割り込んだ。世界的な株価指数からの除外による「小型株化」も意識されている。"}, {"date": "2026-11-05", "rank": 3, "head": "トヨタ、27年3月期の営業益を3兆9000億円に上方修正　原価改善で中国不振を補い自社株買い枠も拡大、株価急伸", "ind": "自動車", "s": "china", "c": ["jp", "cn"], "t": "pos", "summ": "トヨタは5日、4〜9月期決算とあわせて27年3月期の営業利益見通しを前期比4%増の3兆9000億円に引き上げた。原価改善や諸経費の削減が奏功し、中国での販売不振を補った。自社株買い枠の拡大も発表し、日経平均が1110円安となる中で株価は急伸した。"}, {"date": "2026-11-05", "rank": 2, "head": "トランプ氏、イスラエル支援年40億ドルを年内で打ち切り表明　中間選挙で民主候補の批判を受けた「争点潰し」との見方", "ind": "海外政治", "s": "mideast", "c": ["us", "il"], "t": "mix", "summ": "トランプ大統領は3日のFOXニュースのインタビューで、イスラエルへの年40億ドル（約6300億円）の支援を年内で打ち切ると表明した。ネタニヤフ首相と「数カ月前に合意した」と述べたが、イスラエルメディアは財務省が正式な文書を受け取っていないと報じた。"}, {"date": "2026-11-05", "rank": 1, "head": "バンス副大統領「中間選挙の大敗は戦争が理由」　対イランでトランプ氏と距離、NY原油は一時9%安で90ドル割れ", "ind": "海外政治", "s": "mideast", "c": ["us", "ir"], "t": "pos", "summ": "バンス副大統領は4日、共和党の大敗の原因はイランとの戦争だと断言し、中東政策の見直しが必要との考えを示唆した。発言を受けてイランとの交渉進展への期待が広がり、WTI期近物は一時9.3%安の1バレル87.13ドルと約1カ月ぶりに90ドルを割り、北海ブレントも一時93ドル台に下げた。"}, {"date": "2026-11-05", "rank": 0, "head": "日経平均1110円安の6万1077円、4日続落で5カ月半ぶり安値　NYダウは1500ドル高でも日本のAI・半導体株に売り", "ind": "マーケット", "s": "ai", "c": ["jp", "us"], "t": "neg", "summ": "5日の日経平均は前日比1110円73銭（1.79%）安の6万1077円90銭で終え、終値では5月20日以来の安値となった。米国でのAI規制強化への警戒から、日本のAI・半導体関連株が軒並み売られ、下げ幅は一時1400円を超えた。米株高・原油安という追い風を、指数の重いAI銘柄の売りが打ち消した形だ。"}], "arrows": [{"date": "2026-11-03", "f": "jp", "t": "us", "s": "ai", "k": "pos", "l": "個人マネー→AI（IPO最大5528億円）"}, {"date": "2026-11-03", "f": "il", "t": "ir", "s": "mideast", "k": "neg", "l": "再攻撃の要求"}, {"date": "2026-11-03", "f": "sa", "t": "jp", "s": "mideast", "k": "neg", "l": "原油高→航空燃料費増"}, {"date": "2026-11-03", "f": "jp", "t": "pl", "s": "mideast", "k": "pos", "l": "原発の格納容器（IHI）"}, {"date": "2026-11-03", "f": "cn", "t": "th", "s": "china", "k": "neg", "l": "EV輸出攻勢"}, {"date": "2026-11-03", "f": "cn", "t": "de", "s": "china", "k": "neg", "l": "EV輸出2倍"}, {"date": "2026-11-03", "f": "ru", "t": "kp", "s": "sec", "k": "neg", "l": "中朝ロ供給網"}, {"date": "2026-11-03", "f": "cn", "t": "kp", "s": "sec", "k": "neg", "l": "物資・エネルギー供給"}, {"date": "2026-11-03", "f": "us", "t": "jp", "s": "sec", "k": "mix", "l": "原潜保有の肯定論"}, {"date": "2026-11-04", "f": "us", "t": "jp", "s": "ai", "k": "neg", "l": "米議会ねじれ→AI株売り"}, {"date": "2026-11-04", "f": "us", "t": "tw", "s": "ai", "k": "neg", "l": "AI規制懸念で半導体安"}, {"date": "2026-11-04", "f": "us", "t": "kr", "s": "ai", "k": "neg", "l": "韓国株一時4%安"}, {"date": "2026-11-04", "f": "sa", "t": "jp", "s": "mideast", "k": "mix", "l": "原油高→商社益・燃料高"}, {"date": "2026-11-04", "f": "cn", "t": "hk", "s": "china", "k": "pos", "l": "AI向け電子機器の中継輸出"}, {"date": "2026-11-04", "f": "jp", "t": "id", "s": "china", "k": "pos", "l": "アイフルが車ローン会社買収"}, {"date": "2026-11-04", "f"  document.getElementById('pairs').innerHTML="";
 const p=document.getElementById('panel');if(!selC){p.innerHTML='<h3>この期間・流れのニュースはありません</h3>';return}
 const its=cItems(selC).slice().reverse();p.innerHTML=`<h3>${F(selC,16)}${NM(selC)}</h3><div class="dt">${cur==="all"?"すべての流れ":S[cur].name}・${win===1?"きょう":"直近"+win+"日"}・${its.length}件</div><ul>${its.map(x=>`<li><span class="dt">${md(x.date)}</span>${S[x.s]?`<span class="tag" style="background:${S[x.s].color}">${S[x.s].name}</span>`:""}<span style="color:${col(x.t)}">●</span> ${x.head}</li>`).join("")}</ul><div class="dt" style="margin-top:8px">色の付いた国を押すと切り替わります</div>`}
const pk=(a,b)=>[a,b].sort().join("|");
function agg(){const P={},Dm={};for(const m of D.moves.filter(inWin).filter(m=>cur==='all'||m.s===cur)){if(m.path[0]===m.path[1]){(Dm[m.path[0]]=Dm[m.path[0]]||[]).push(m);continue}for(let i=0;i<m.path.length-1;i++){if(m.path[i]===m.path[i+1])continue;const k=pk(m.path[i],m.path[i+1]);(P[k]=P[k]||[]).push(m)}}return {P,Dm}}
function coMoves(){return D.moves.filter(inWin).filter(m=>cur==='all'||m.s===cur)}
function coCtry(n,m,side){return (D.cos[n]&&D.cos[n].c)||(side==='a'?m.path[0]:m.path[1])}
function coByCountry(){const R={};for(const m of coMoves()){if(m.a_co!==false){const c=coCtry(m.a,m,'a');(R[c]=R[c]||new Set()).add(m.a)}if(m.b_co!==false){const c=coCtry(m.b,m,'b');(R[c]=R[c]||new Set()).add(m.b)}}return R}
function kindBar(ms){const cnt={};ms.forEach(m=>cnt[m.k]=(cnt[m.k]||0)+1);const mx=Math.max(...Object.values(cnt));return Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]).map(k=>`<div style="display:flex;align-items:center;gap:6px;margin:3px 0"><span class="kd" style="background:${D.kinds[k][1]};min-width:64px;text-align:center">${D.kinds[k][0]}</span><span style="flex:1;height:8px;border-radius:4px;background:${D.kinds[k][1]};opacity:.75;max-width:${Math.round(140*cnt[k]/mx)}px"></span><b>${cnt[k]}件</b></div>`).join('')}
function pairPop(k,ms,ev){const p=popEl();const [a,b]=k.split('|');p.innerHTML=`<button class="x" aria-label="閉じる">×</button><h4>${F(a,14)}${NM(a)} ⇄ ${F(b,14)}${NM(b)}</h4><div class="dt" style="margin-bottom:6px">${cur==='all'?'すべての流れ':S[cur].name}・${win===1?'きょう':'直近'+win+'日'}・${ms.length}件</div>${kindBar(ms)}<ul style="margin-top:6px">${ms.slice().reverse().map(m=>`<li><span class="dt">${md(m.date)}</span> <span style="color:${D.kinds[m.k][1]}">●</span> <b>${m.a}</b> → ${m.b}：${m.t}</li>`).join('')}</ul>`;showPop(p,ev)}
function ctyPanel(c,CC){const set=CC[c]||new Set();const mv=coMoves();const by={};for(const n of set){const ind=(D.cos[n]&&D.cos[n].ind)||'業種不明';(by[ind]=by[ind]||[]).push(n)}
 const inds=Object.keys(by).sort((x,y)=>by[y].length-by[x].length);const own=mv.filter(m=>(m.a_co!==false&&coCtry(m.a,m,'a')===c)||(m.b_co!==false&&coCtry(m.b,m,'b')===c));
 const row=n=>{const r=mv.filter(m=>m.a===n||m.b===n);return `<div class="mv"><span class="who">${coLink(n)}</span>${r.slice().reverse().map(m=>{const out=m.a===n,o=out?m.b:m.a,oc=out?coCtry(m.b,m,'b'):coCtry(m.a,m,'a');return `<div style="margin-top:3px"><span class="kd" style="background:${D.kinds[m.k][1]}">${D.kinds[m.k][0]}</span> ${out?'→':'←'} ${F(oc,12)}${coLink(o)}：${m.t}<div class="amt">${md(m.date)}${m.amt&&m.amt!=='—'?'　金額：'+m.amt:''}</div></div>`}).join('')}</div>`};
 document.getElementById('panel').innerHTML=`<h3>${F(c,16)}${NM(c)}の企業</h3><div class="dt">${cur==='all'?'すべての流れ':S[cur].name}・${win===1?'きょう':'直近'+win+'日'}・${set.size}社・${own.length}件</div><div style="margin:8px 0">${kindBar(own)}</div>${inds.map(i=>`<div class="sec" style="margin-top:10px">${i}（${by[i].length}社）</div>${by[i].map(row).join('')}`).join('')}<div class="dt" style="margin-top:8px">国を押すと切り替わります。企業名を押すとタイムラインへ</div>`}
function drawCo(){const zf=base();const {P,Dm}=agg();const inv=new Set();Object.keys(P).forEach(k=>k.split("|").forEach(c=>inv.add(c)));Object.keys(Dm).forEach(c=>inv.add(c));
 const keys=Object.keys(P).sort((a,b)=>P[b].length-P[a].length).concat(Object.keys(Dm).map(c=>"dom:"+c));
 if(!selPair||!(selPair in P||selPair.startsWith("dom:")&&Dm[selPair.slice(4)]||selPair.startsWith('cty:')))selPair=keys[0]||null;
 const CC=coByCountry();const mxC=Math.max(1,...Object.values(CC).map(x=>x.size));const hue=cur!=='all'&&S[cur]?S[cur].color:'#2563eb';
 for(const c of M.countries){const p=el('path',{d:c.d,class:'ctry'});const n=c.iso&&CC[c.iso]?CC[c.iso].size:0;if(n){p.style.fill=hue;p.style.fillOpacity=(.22+.6*Math.sqrt(n/mxC)).toFixed(2);p.classList.add('hit');p.onclick=()=>{selPair='cty:'+c.iso;render()}}else if(c.iso&&inv.has(c.iso))p.style.fill='var(--landHi)';const t=el('title',{},p);t.textContent=NM(c.iso)+(n?`：${n}社（押すと企業一覧）`:'')}
 for(const k in P){const [a,b]=k.split("|");const A=M.cent[a],B=M.cent[b];if(!A||!B)continue;const ms=P[k];const cnt={};ms.forEach(m=>cnt[m.k]=(cnt[m.k]||0)+1);const dk=Object.keys(cnt).sort((x,y)=>cnt[y]-cnt[x])[0];
  const [d,mx,my]=curve(A,B);el('path',{d,class:'pair'+(selPair===k?' sel':''),stroke:D.kinds[dk][1],'stroke-width':1.5+Math.min(ms.length,8)*1.4});const h=el('path',{d,class:'pairhit'});h.onclick=ev=>{ev.stopPropagation();selPair=k;render();pairPop(k,ms,ev)};
  const g=el('g',{style:'cursor:pointer'});el('circle',{cx:mx,cy:my,r:9/zf,fill:'var(--card)',stroke:D.kinds[dk][1],'stroke-width':1.5/zf},g);const tx=el('text',{x:mx,y:my+4/zf,'text-anchor':'middle','font-size':11/zf,'font-weight':700,fill:'var(--ink)'},g);tx.textContent=ms.length;g.onclick=ev=>{ev.stopPropagation();selPair=k;render();pairPop(k,ms,ev)}}
 for(const c in Dm){const C=M.cent[c];if(!C)continue;const g=el('g',{style:'cursor:pointer'});el('circle',{cx:C[0]+14/zf,cy:C[1]+11/zf,r:10/zf,fill:'#334155',stroke:selPair==='dom:'+c?'#fbbf24':'none','stroke-width':2/zf},g);const tx=el('text',{x:C[0]+14/zf,y:C[1]+15/zf,'text-anchor':'middle','font-size':11/zf,'font-weight':700,fill:'#fff'},g);tx.textContent=Dm[c].length;const tt=el('title',{},g);tt.textContent=NM(c)+'の国内の企業どうしの動き';g.onclick=()=>{selPair='dom:'+c;render()}}
 for(const c of inv){const C=M.cent[c];if(C)el('image',{href:`flags/${c}.svg`,x:C[0]-8/zf,y:C[1]-6/zf,width:16/zf,height:12/zf})}
 for(const c in CC){const C=M.cent[c];if(!C)continue;const t=el('text',{x:C[0],y:C[1]-9/zf,'text-anchor':'middle',class:'lbl','font-size':10.5/zf,'stroke-width':3/zf,style:'cursor:pointer'});t.textContent=CC[c].size+'社';t.onclick=()=>{selPair='cty:'+c;render()}}
 document.getElementById('legend').innerHTML='<span>国の濃さ・「○社」＝動きのあった企業数（押すと企業一覧）／線の色＝動きの種類・太さと数字＝件数（押すと内訳）／紺の丸＝国内どうしの件数</span>';
 const lab=k=>k.startsWith("dom:")?`${F(k.slice(4))}${NM(k.slice(4))}国内`:k.split("|").map(c=>F(c)+NM(c)).join(" ⇄ ");
 document.getElementById('pairs').innerHTML=keys.map(k=>`<button class="${k===selPair?'on':''}" data-k="${k}">${lab(k)} <b>${k.startsWith("dom:")?Dm[k.slice(4)].length:P[k].length}</b></button>`).join("");
 document.querySelectorAll('#pairs button').forEach(b=>b.onclick=()=>{selPair=b.dataset.k;render()});
 if(selPair&&selPair.startsWith('cty:')){ctyPanel(selPair.slice(4),CC);bindCo();return}
 const ms=!selPair?[]:selPair.startsWith("dom:")?Dm[selPair.slice(4)]:P[selPair];
 document.getElementById('panel').innerHTML=!selPair?'<h3>この期間の企業の動きはありません</h3><div class="dt">期間を「30日」に広げてください</div>':`<h3>${lab(selPair)}</h3><div class="dt">${ms.length}件・${win===1?"きょう":"直近"+win+"日"}</div>`+ms.slice().reverse().map(m=>`<div class="mv"><span class="kd" style="background:${D.kinds[m.k][1]}">${D.kinds[m.k][0]}</span><span class="who">${coLink(m.a)} → ${coLink(m.b)}</span><div>${m.t}</div><div class="amt">${md(m.date)}　${m.amt&&m.amt!=='—'?'金額：'+m.amt:''}${S[m.s]?' <span class="tag" style="background:'+S[m.s].color+'">'+S[m.s].name+'</span>':''}</div>${m.note?'<div class="nt">🧭 '+m.note+'</div>':''}</div>`).join("");
 bindCo()}
const coLink=n=>D.cos[n]?`<a class="co" data-co="${n}">${n}</a>`:n;
function bindCo(){document.querySelectorAll('[data-co]').forEach(a=>a.onclick=()=>{selCo=a.dataset.co;coSection();document.getElementById('coh').scrollIntoView({behavior:'smooth'})})}
function coSection(){const names=Object.keys(D.cos).filter(n=>!coq||n.includes(coq)).sort((a,b)=>D.cos[b].n-D.cos[a].n||a.localeCompare(b));
 if(!selCo||!D.cos[selCo])selCo=names[0];document.getElementById('cochips').innerHTML=names.slice(0,40).map(n=>`<button class="chip ${n===selCo?'on':''}" style="${n===selCo?'background:#334155':''}" data-co="${n}">${F(D.cos[n].c)}${n}<span class="dt">${D.cos[n].n}</span></button>`).join("");
 const c=D.cos[selCo];if(!c){document.getElementById('cocard').innerHTML='該当なし';return}
 const rel=D.moves.filter(m=>m.a===selCo||m.b===selCo);
 const tl=rel.map(m=>({d:m.date,k:m.k,t:(m.a===selCo?'→ '+m.b:'← '+m.a)+'：'+m.t})).concat(c.kk.map(([d,t])=>({d,k:'kk',t}))).sort((a,b)=>b.d.localeCompare(a.d));
 const KK=Object.assign({},D.kinds,{kk:["その日の動き","#64748b"]});
 const cps=rel.map(m=>{const out=m.a===selCo;return {n:out?m.b:m.a,c:out?m.path[1]:m.path[0],k:m.k}});
 const W=380,H=270,cx=W/2,cy=H/2;let ego=`<svg id="ego" viewBox="0 0 ${W} ${H}">`;cps.forEach((p,i)=>{const an=-Math.PI/2+i*2*Math.PI/Math.max(cps.length,1);const x=cx+Math.cos(an)*125,y=cy+Math.sin(an)*95;
  ego+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="${D.kinds[p.k][1]}" stroke-width="2.5"/><circle cx="${x}" cy="${y}" r="5" fill="${D.kinds[p.k][1]}"/>${p.c?`<image href="flags/${p.c}.svg" x="${x-8}" y="${y+7}" width="16" height="12"/>`:''}<text x="${x}" y="${y-9}" text-anchor="middle">${p.n.length>14?p.n.slice(0,14)+'…':p.n}</text>`});
 ego+=`<circle cx="${cx}" cy="${cy}" r="32" fill="#334155"/><text x="${cx}" y="${cy+4}" text-anchor="middle" style="fill:#fff;stroke:none;font-weight:700">${selCo.length>7?selCo.slice(0,6)+'…':selCo}</text></svg>`;
 document.getElementById('cocard').innerHTML=`<div class="cohead">${F(c.c,18)}<h3>${selCo}</h3><span class="dt">${c.ind||""}${c.code&&c.code!=="—"?"・"+c.code:""}</span></div>${c.lens?`<div class="lens">💡 この会社の動きの見方：${c.lens}</div>`:""}
 <div class="cogrid"><div><div class="sec">動きのタイムライン（新しい順）</div><ul class="tl">${tl.map(x=>`<li style="--c:${KK[x.k][1]}"><span class="dt">${md(x.d)}</span><span class="kd" style="background:${KK[x.k][1]}">${KK[x.k][0]}</span>${x.t}</li>`).join("")}</ul></div>
 <div><div class="sec">つながり（線の色＝動きの種類）</div>${cps.length?ego:'<div class="dt">まだ企業どうしの動きの記録がありません</div>'}</div></div>`;bindCo()}
function chips(){const e=document.getElementById('chips');e.style.display='flex';document.getElementById('kinds').style.display=mode==='co'?'flex':'none';
 e.innerHTML=[`<button class="chip ${cur==='all'?'on':''}" style="${cur==='all'?'background:#334155':''}" data-id="all">すべて</button>`].concat(D.streams.map(s=>`<button class="chip ${cur===s.id?'on':''}" style="${cur===s.id?'background:'+s.color:''}" data-id="${s.id}"><span class="dot" style="background:${cur===s.id?'#fff':s.color}"></span>${s.name}</button>`)).join("");
 e.querySelectorAll('button').forEach(b=>b.onclick=()=>{cur=b.dataset.id;selC=null;selPair=null;render()});
 document.getElementById('kinds').innerHTML=Object.values(D.kinds).map(k=>`<span class="chip static"><span class="dot" style="background:${k[1]}"></span>${k[0]}</span>`).join("")}
function segs(){[["mode","m",mode],["win","w",String(win)],["zoom","z",zoom]].forEach(([id,a,v])=>document.querySelectorAll('#'+id+' button').forEach(b=>b.classList.toggle('on',b.dataset[a]===v)))}
function render(){const _p=document.getElementById('apop');if(_p)_p.style.display='none';segs();chips();mode==='flow'?drawFlow():drawCo()}
document.querySelectorAll('#mode button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;render()});
document.querySelectorAll('#win button').forEach(b=>b.onclick=()=>{win=+b.dataset.w;selPair=null;render()});
document.querySelectorAll('#zoom button').forEach(b=>b.onclick=()=>{zoom=b.dataset.z;render()});
document.getElementById('cosearch').oninput=e=>{coq=e.target.value.trim();coSection()};
document.getElementById('links').innerHTML=D.links.filter(l=>S[l[0]]&&S[l[1]]).map(l=>`<span class="link"><b style="color:${S[l[0]].color}">${S[l[0]].name}</b> → <b style="color:${S[l[1]].color}">${S[l[1]].name}</b><br><span style="color:var(--sub)">${l[2]}</span></span>`).join("");
document.getElementById('streams').innerHTML=D.streams.map(s=>{const ev=D.news.filter(n=>n.s===s.id).slice(-5).reverse();const ph=s.phase_hist||[];
 return `<div class="card st" id="s-${s.id}" style="border-top-color:${s.color}"><h3>${s.name}<span>${(s.flags||[]).map(c=>F(c)).join(" ")}</span></h3><p class="one">${s.one}</p>
<div class="sec">いまのフェーズ</div><div class="phase">${D.phases.map((p,i)=>`<span class="${i===s.phase?'cur':''}" style="${i===s.phase?'background:'+s.color:''}">${p}</span>`).join("")}</div>
<div class="phh">${ph.length?ph.slice(-3).reverse().map(h=>`${md(h.date)}：${D.phases[h.phase]}${h.why?"（"+h.why+"）":""}`).join("<br>"):""}</div>
<div class="sec">仕組み</div><div class="mech">${s.mech.map(m=>`<b>${m}</b>`).join("<em>→</em>")}</div>
${(s.ind||[]).length?`<div class="sec">定点指標</div><div class="ind">${s.ind.map(i=>`<div>${i[0]}</div><div>${i[1]}</div>`).join("")}</div>`:""}
<div class="sec">最近の出来事</div><ul class="ev">${ev.length?ev.map(e=>`<li>${e.c.slice(0,2).map(c=>F(c)).join("")}<span><span class="dt">${md(e.date)}</span>${e.head}</span></li>`).join(""):'<li class="dt">直近30日の記録なし</li>'}</ul>
${s.branch?`<div class="sec">次の分岐点</div><div class="kv">${s.branch}</div>`:""}<div class="sec">歴史上の似た局面</div><div class="kv">${s.hist}</div>
<div class="sec">関連する問い</div><div class="qs">${(s.qs||[]).map(q=>`<a href="./deepdives.html">${D.stories[q]||q}</a>`).join("")}</div></div>`}).join("");
document.getElementById('news').innerHTML=D.news.filter(n=>n.date===D.today).sort((a,b)=>a.rank-b.rank).map(n=>`<li>${n.c.map(c=>F(c)).join("")}<span class="ind2">${n.ind}</span><span style="flex:1;min-width:200px">${n.head}</span>${S[n.s]?`<span class="tag" style="background:${S[n.s].color}">${S[n.s].name}</span>`:""}</li>`).join("");
if(location.hash.startsWith("#s-")){setTimeout(()=>document.querySelector(location.hash)?.scrollIntoView(),50)}
render();coSection();
</script></body></html>
