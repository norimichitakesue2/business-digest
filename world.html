 "人手不足→AI・自動化の需要"], ["sec", "rate", "防衛費→財政負担"]], "news": [{"date": "2026-11-03", "rank": 31, "head": "日本は「50歳真ん中社会」　25年国勢調査で年齢の中央値が初めて50歳超え、半世紀で約20歳上昇", "ind": "社会", "s": "demo", "c": ["jp"], "t": "mix", "summ": "25年の国勢調査で日本の年齢の中央値が初めて50歳を超えた。半世紀で約20歳上昇し、人口の過半を50歳以上が占める。年齢に関わらず誰もが生き生きと暮らせる社会づくりが欠かせない。"}, {"date": "2026-11-03", "rank": 30, "head": "阪神・佐藤輝明ら3人がポスティング公示　大リーグ移籍市場、新労使協定次第で交渉期限が前倒しも", "ind": "エンタメ", "s": null, "c": ["jp", "us"], "t": "mix", "summ": "大リーグ機構はポスティングシステムで移籍を目指す阪神の佐藤輝明、西武の平良海馬、日本ハムの伊藤大海の3選手を全30球団に通知した。交渉期間は45日間だが、新労使協定が結ばれない場合は12月1日に期限が前倒しになる。"}, {"date": "2026-11-03", "rank": 29, "head": "貴金属の買い取りトラブル、25年度は937件で過去最多　金高騰で強引な勧誘、店舗はクーリングオフ対象外", "ind": "小売", "s": "mideast", "c": ["jp"], "t": "neg", "summ": "国民生活センターへの貴金属などの買い取りに関する相談は25年度に937件と過去最多で、5年で5倍超になった。金の高騰を背景に強引に勧誘され、意に沿わない売却に至るケースが目立つ。店舗買い取りはクーリングオフの対象外だ。"}, {"date": "2026-11-03", "rank": 28, "head": "ピザハット、500円からの低価格ピザを強化　物価高で購入頻度を高める価格帯に人気", "ind": "外食", "s": null, "c": ["jp"], "t": "mix", "summ": "日本ピザハットは2日、「3種チーズのラザニア風ミートソースピザ」を発売した。1人用セット「ピザポテBOX」では500円とし、低価格帯を強化する。持ち帰り価格はSサイズ880円、Mサイズ1300円、Lサイズ1890円に抑えた。"}, {"date": "2026-11-03", "rank": 27, "head": "防災庁が発足、自治体の「弱点」を洗い出し事前防災へ　国民の備蓄はなお4割台", "ind": "建設", "s": null, "c": ["jp"], "t": "pos", "summ": "防災庁が2日に発足した。防災計画を見直し各自治体の防災上の課題を洗い出すほか、全都道府県に国とのパイプ役となる専任職員を置き対策を助言する。国民の災害備蓄はなお4割台にとどまり、緊急要請で備えを促す。"}, {"date": "2026-11-03", "rank": 26, "head": "9月のホテル客室単価は8.8%高の2万657円　訪日客が下支え、民泊大手は23区の規制強化でホテル開発にシフト", "ind": "不動産", "s": null, "c": ["jp"], "t": "pos", "summ": "STRがまとめた9月の国内ホテル平均客室単価は前年同月比8.8%高い2万657円。秋の訪日客需要が押し上げた。民泊国内最大手のマツリテクノロジーズは、4人以上で泊まれる部屋を主体にしたホテルを10カ所以上開業する。"}, {"date": "2026-11-03", "rank": 25, "head": "豪金鉱山大手ノーザンスター、金を5〜7割増産へ　4兆円の買収案を拒否し自力成長", "ind": "資源", "s": "mideast", "c": ["au"], "t": "mix", "summ": "ノーザンスター・リソーシズは処理設備を刷新し新鉱山の開発を検討する。実現すれば30年ごろに生産量は5〜7割増える見通し。約4兆円の買収案を拒否し、自力での企業価値向上を目指す。"}, {"date": "2026-11-03", "rank": 24, "head": "北朝鮮経済、中朝ロの供給網で3%成長　国連制裁前の水準を上回る、ロシア向け武器生産が支え", "ind": "海外", "s": "sec", "c": ["kp", "cn", "ru"], "t": "neg", "summ": "北朝鮮の高成長が続いている。物資やエネルギーを中国とロシアから調達し、軍需品が逼迫するロシア向けの武器を生産する供給網が支える。9月と10月には北朝鮮とロシア、中国を結ぶ自動車用の橋が相次いで開通した。戦争特需に依存し持続性は見通せない。"}, {"date": "2026-11-03", "rank": 23, "head": "イスラエル首相、中間選挙直後のイラン再攻撃をトランプ氏に要求と米報道　トランプ氏は協議を優先", "ind": "海外政治", "s": "mideast", "c": ["il", "ir", "us"], "t": "neg", "summ": "米アクシオスは1日、ネタニヤフ首相がトランプ大統領に中間選挙の直後にイランを再度攻撃するよう求めたと報じた。両首脳は10月31日に電話協議した。トランプ氏はイランとの協議を優先する意向で、双方の立場には隔たりがある。"}, {"date": "2026-11-03", "rank": 22, "head": "IHI、ポーランド原発の格納容器を米WHから受注　新規原発向け機器は10年ぶり", "ind": "エネルギー", "s": "mideast", "c": ["jp", "pl", "us"], "t": "pos", "summ": "IHIはWHから、ポーランドで建設する原発の1号機向け格納容器と鋼製モジュールを受注した。新規原発向けの機器受注は10年ぶり。まず設計と材料調達の先行契約を結び、今後製造して納入する。"}, {"date": "2026-11-03", "rank": 21, "head": "アイシンと東北大、消費電力50分の1の新型半導体を開発　磁気メモリーMRAMを組み込んだSoC", "ind": "半導体", "s": "ai", "c": ["jp"], "t": "pos", "summ": "アイシンは東北大学と、省電力のMRAMを組み込み従来比で消費電力を50分の1に抑えた新型SoC（システム・オン・チップ）を開発したと発表した。AIや画像認識など大容量データ処理の効率化に役立ち、今後実用化を目指す。"}, {"date": "2026-11-03", "rank": 20, "head": "住友化学、純利益48%増の900億円に上方修正　AI向け半導体材料が好調　京セラ・日本触媒も電子材料で攻勢", "ind": "半導体", "s": "ai", "c": ["jp"], "t": "pos", "summ": "住友化学は27年3月期の純利益が前期比48%増の900億円になる見通しで従来予想を200億円上回る。AI需要で半導体材料が想定を上回り、石化市況の好転も寄与する。京セラは4〜9月期の純利益が32%増と製造装置向け部品が好調。日本触媒は互応化学工業を200億円で完全子会社化し半導体材料を強化する。"}, {"date": "2026-11-03", "rank": 19, "head": "住友商事、27年3月期の純利益を6700億円に上方修正　アルミなど資源が好調、中東影響は想定より小さく", "ind": "商社", "s": "mideast", "c": ["jp"], "t": "pos", "summ": "住友商事は27年3月期の連結純利益が前期比12%増の6700億円になる見通しを発表し、従来予想から400億円上方修正した。アルミなど資源が好調で、中東情勢のマイナス影響も想定より小さい。配当は年44円と4円積み増し、株式分割考慮で実質増配となる。"}, {"date": "2026-11-03", "rank": 18, "head": "日本郵船、年間配当330円に引き上げへ　データセンター関連輸送が好調、商船三井も純利益41%増に上振れ", "ind": "海運", "s": "mideast", "c": ["jp"], "t": "pos", "summ": "日本郵船は27年3月期の年間配当を330円前後に引き上げるもよう。従来計画を90円前後上回り、配当利回りは4.5%程度になる。データセンター関連設備の輸送などが好調。商船三井も27年3月期の純利益が41%増に上振れする見通しで、運賃上昇の恩恵を受ける。"}, {"date": "2026-11-03", "rank": 17, "head": "JAL・ANAの4〜9月期は最終減益　燃料費が2社で2300億円増、サーチャージ引き上げでも補えず", "ind": "航空", "s": "mideast", "c": ["jp"], "t": "neg", "summ": "日本の航空大手2社の4〜9月期決算が出そろい、ともに最終減益だった。燃料費は2社合計で前年同期比2300億円増えた。JALの純利益は42%減の390億円と4年ぶりの低水準。JALの鳥取社長は国内線維持へ中堅との関係強化を進める考えを示した。"}, {"date": "2026-11-03", "rank": 16, "head": "マスク氏、米南部で7つの巨大施設　スペースXとテスラ統合をにらみ、AIロボ・車・半導体・エネルギーを総取りへ", "ind": "宇宙", "s": "ai", "c": ["us"], "t": "pos", "summ": "マスク氏は米南部テキサス州などで7つの巨大施設の建設を進めている。AI搭載のロボットや車を軸に、半導体からエネルギーまでを押さえる巨大プラットフォーマーを目指す。スペースXとテスラの統合も視野に入れる。"}, {"date": "2026-11-03", "rank": 15, "head": "金属労協・金子議長、27年春闘で「一段高い視点」　持続的賃上げで成長の好循環目指す", "ind": "人材", "s": "demo", "c": ["jp"], "t": "mix", "summ": "金属労協の金子晃浩議長は日本経済新聞のインタビューで、27年春闘について「一段高い視点で取り組みたい」と述べ、持続的な賃上げで成長の好循環を目指す考えを示した。"}, {"date": "2026-11-03", "rank": 14, "head": "ミスミ、高卒と大卒の初任給を30万円に統一　通年採用で学歴不問、AI時代に課題設定力を重視", "ind": "人材", "s": "demo", "c": ["jp"], "t": "pos", "summ": "ミスミグループ本社は高卒・大卒・既卒の若手を同じ枠で通年採用する制度を11月から始めた。初任給は月30万3000円で統一。学歴ではなく課題設定力や変化への対応力を重視する。"}, {"date": "2026-11-03", "rank": 13, "head": "トラック運賃の下限を国が示す「適正原価制度」、28年にも開始　運送料2割上昇の試算、荷主と消費者に波及", "ind": "物流", "s": "demo", "c": ["jp"], "t": "neg", "summ": "28年6月までに施行されるトラック適正化2法で、国が示す原価を下回る運賃を規制する「適正原価制度」が導入される。運転手への適切な賃金の原資とする狙いで、運賃は2割増えるとの民間試算もある。荷主企業は早期対応が必要で、消費者への影響も避けられない。"}, {"date": "2026-11-03", "rank": 12, "head": "みらい、消費税減税法案に反対方針　物価高対策としての効果を疑問視", "ind": "政治", "s": "rate", "c": ["jp"], "t": "mix", "summ": "政党みらいは消費税減税法案に反対する方針を決めた。物価高対策としての効果を疑問視している。価格への反映は6割にとどまるとの試算もあり、国会審議では実効性と財源が論点になる。"}, {"date": "2026-11-03", "rank": 11, "head": "日本の原子力潜水艦保有に米国で肯定論　アジア広域の対中抑止に役割、人材・財政のハードルは高く", "ind": "防衛", "s": "sec", "c": ["jp", "us", "cn"], "t": "mix", "summ": "日本の原潜保有について米国から肯定的な意見が出ている。海上自衛隊が西太平洋を含むアジア広域で活動しやすくなり中国抑止に役立つとの見方だ。小泉防衛相は10月23日の衆院安全保障委員会で次世代潜水艦の動力に関し「幅広い選択肢について議論する必要がある」と述べた。"}, {"date": "2026-11-03", "rank": 10, "head": "滋賀銀と池田泉州HDの統合は「合併なき再編」　持ち株会社の下で2行独立、激しい金利競争への最適解か", "ind": "金融", "s": "rate", "c": ["jp"], "t": "mix", "summ": "10月29日に発表した滋賀銀行と池田泉州HDの経営統合は持ち株会社の下で傘下2行を独立させる方針。滋賀銀の久保田頭取は「現時点で合併は考えていない」と語った。地域の伝統を守る利点はあるが、統合効果を出し切れるかが問われる。"}, {"date": "2026-11-03", "rank": 9, "head": "SBIHD、4〜9月の純利益39%増の2305億円で過去最高　米デジタル銀行エレボールに1億ドル出資", "ind": "金融", "s": "rate", "c": ["jp", "us"], "t": "pos", "summ": "SBIHDの4〜9月期の純利益は前年同期比39%増の2305億円と同期間で過去最高。収益は17%増の1兆575億円。スタートアップ投資が好調で、国内金利上昇で銀行・証券も伸びた。同日、24時間即時決済のエレボールバンクに約160億円を出資すると発表した。"}, {"date": "2026-11-03", "rank": 8, "head": "金価格が急落、1年ぶり安値の3869ドル　金利低下でも売り、中間選挙後の原油高とインフレ再加速に警鐘", "ind": "マーケット", "s": "mideast", "c": ["us"], "t": "mix", "summ": "ロンドン現物は10月30日に一時前日比4%近く下げ、1トロイオンス3869ドルと25年10月以来1年ぶりの安値をつけた。金利低下でも売りが続く変調は、中間選挙後に原油が高騰しインフレ再加速で米利上げ圧力が強まるシナリオへの警鐘とされる。"}, {"date": "2026-11-03", "rank": 7, "head": "「動かぬ円」再び、10月の値幅は4年半ぶりの小ささ　ヘッジファンドの円売りが一巡、構造的な円売りは残る", "ind": "為替", "s": "rate", "c": ["jp", "us"], "t": "mix", "summ": "10月の円相場の対ドルの変動幅は4年半ぶりの小ささとなった。デジタル赤字など構造的な円売りが残る一方、26年度前半の円安を演出したヘッジファンドの動きが落ち着いた。市場参加者からは「取引量が圧倒的に少ない」との声が上がる。"}, {"date": "2026-11-03", "rank": 6, "head": "アンソロピックIPO、日本で最大5528億円を調達　スペースXを6割上回り海外企業として過去最大", "ind": "IT・AI", "s": "ai", "c": ["us", "jp"], "t": "pos", "summ": "アンソロピックは2日、IPOで最大35億ドル（約5528億円）を日本で調達すると発表した。関東財務局に提出した有価証券届出書で明らかにした。みずほ証券が取りまとめ、ゴールドマン・サックス、三菱UFJモルガン・スタンレー、モルガン・スタンレーMUFG、楽天、SBIの各証券でも購入できる。"}, {"date": "2026-11-03", "rank": 5, "head": "中国BYD、10月の新車販売11%増の49万台　EVは4割増、輸出は2倍に", "ind": "海外", "s": "china", "c": ["cn", "th"], "t": "neg", "summ": "BYDの10月の新車販売は前年同月比11%増の49万168台。EVが37%増の30万5743台、PHVは17%減の17万7382台だった。海外での新型車投入を増やし、輸出は2倍になった。"}, {"date": "2026-11-03", "rank": 4, "head": "10月の国内新車販売は3%減の38万台、7カ月ぶりマイナス　軽自動車が苦戦、登録車は1%増", "ind": "自動車", "s": "rate", "c": ["jp"], "t": "neg", "summ": "10月の国内新車販売（軽含む）は前年同月比3%減の38万1756台と7カ月ぶりに前年を下回った。ダイハツやスズキなど軽主力メーカーの販売減が目立ち、登録車は1%増の24万9180台だった。"}, {"date": "2026-11-03", "rank": 3, "head": "自動運転車「ハンドル無し」を一律認定へ　レベル4以上、国交省が12月から保安基準を適用　ロボタクシー量産を後押し", "ind": "自動車", "s": "demo", "c": ["jp"], "t": "pos", "summ": "国土交通省はハンドルやブレーキペダルのない車両を一律に認定する方向で保安基準を見直し、12月以降の生産車に適用する方針。4日の車両安全対策検討会で議論する。自動運転タクシーの普及を見据え量産化を後押しする。"}, {"date": "2026-11-03", "rank": 2, "head": "サイバー防衛、制度が追いつかず　「能動的サイバー防御」の前倒し求める声　AI攻撃にはソフトの耐性基準を", "ind": "政策", "s": "bloc", "c": ["jp"], "t": "mix", "summ": "与野党や有識者から、政府の同意なき情報取得の前倒しや国の体制強化を求める声が上がる。識者はAIによる攻撃に備え、国がソフトウエアに耐性基準を設けるべきだと提言する。"}, {"date": "2026-11-03", "rank": 1, "head": "サイバー保険の問い合わせ3倍に　GMO問題などで危機感、中小企業でも関心　保険料上昇の懸念も", "ind": "金融", "s": "bloc", "c": ["jp"], "t": "mix", "summ": "東京海上日動ではサイバー保険の契約企業からの専用窓口への相談が10月、4〜9月の月平均の3倍に増えた。損保各社は事前に被害を減らす診断・支援を強化する。大型事故が続けば保険料の上昇につながるとの懸念もある。"}, {"date": "2026-11-03", "rank": 0, "head": "GMO不正アクセス、警視庁が捜査本部設置　24年4月に脆弱性を把握しながら抜本解決できず、150社傘下の複雑な統治が防御を後手に", "ind": "通信・IT", "s": "bloc", "c": ["jp"], "t": "neg", "summ": "熊谷正寿会長兼社長は2日の会見で、24年4月にシステムの欠陥（脆弱性）を把握しながら抜本解決に至らず、発覚の遅れと被害拡大を招いたと説明し「私が介在すべきだった」と述べた。警視庁は捜査本部を設置。同社は発行済み株式の16%にあたる自己株1712万株の消却も発表した。"}, {"date": "2026-11-04", "rank": 30, "head": "決済代行の全東信破綻、売上金が宙に浮いた飲食店　逆境を機に店舗DXが動き出す", "ind": "決済・外食", "s": "sec", "c": ["jp"], "t": "neg", "summ": "東京・錦糸町の鮨店では約70万円の売上金が宙に浮き、客の8割弱がカード払いのため予約キャンセルも相次いだ。被害を受けた飲食店では、決済手段の分散や予約・会計のデジタル化に動く例が出ている。"}, {"date": "2026-11-04", "rank": 29, "head": "アップル、iPhoneは「高価格機種頼み」の年末商戦　日本では最低20万円超の機種のみ、半導体の供給制約で成長鈍化", "ind": "IT・家電", "s": "ai", "c": ["us", "jp"], "t": "neg", "summ": "アップルは10〜12月期にiPhone標準モデルの新製品を出さず、日本では最低20万円超の高額機種のみとなる。半導体の供給制約も響き、全社の世界での成長率は鈍る見通し。新CEOにとって初の年末商戦になる。"}, {"date": "2026-11-04", "rank": 28, "head": "英国、永住権取得に必要な滞在年数を5年から10年に　EU離脱後の移民急増で厳格化、医療従事者は据え置き", "ind": "海外", "s": "demo", "c": ["gb"], "t": "neg", "summ": "英政府は一般労働者の移民が永住権を申請するために必要な滞在年数を2027年に5年間から10年間に延ばすと発表した。医療従事者らは5年間で据え置き優遇する。"}, {"date": "2026-11-04", "rank": 27, "head": "私大の公立化で問われる地元貢献　千歳科技大は半導体人材をラピダスへ送り出す", "ind": "教育・人材", "s": "demo", "c": ["jp"], "t": "mix", "summ": "2019年度に公立化した公立千歳科学技術大学は、地元の半導体産業の期待を受けて人材育成を強化し、ラピダスへ人材を送り出している。公立化後に地元にどう貢献するかが試されている。"}, {"date": "2026-11-04", "rank": 26, "head": "エムスリー、4〜9月の純利益12%減　製薬向けマーケティング支援が低調　医師の51%は治療法選択に生成AIを活用", "ind": "ヘルスケア", "s": "ai", "c": ["jp"], "t": "neg", "summ": "エムスリーの4〜9月期の純利益は前年同期比12%減の199億円だった。売上収益は6%増の1818億円で、医療DX支援や治験支援が伸びた。デロイトトーマツの調査では国内医師の51%が治療法選択の情報収集に生成AIを使い、がん領域で特に多かった。"}, {"date": "2026-11-04", "rank": 25, "head": "アイフル、インドネシアの中古商用車ローン会社を40億円で買収　既存の事業基盤を強化", "ind": "金融", "s": "china", "c": ["jp", "id"], "t": "pos", "summ": "ムニノバHDは傘下のアイフルを通じ、インドネシアで中古商用車向けローンを手がけるマルティンド・オートファイナンスを約40億円で買収したと発表した。同社の25年12月期の総資産は約97億円。アイフルが同国で築いた基盤を強化する。"}, {"date": "2026-11-04", "rank": 24, "head": "九州大学、次世代造船の産学官組織を設立　大島造船所など36者が参加し研究開発と人材育成", "ind": "造船", "s": "sec", "c": ["jp", "cn", "kr"], "t": "pos", "summ": "九州大学は次世代造船業の研究開発や人材育成を担う産学官組織を設立した。地場大手の大島造船所など36者が参加する。設計のデジタル化や新燃料船の開発、技術者の育成を進める。"}, {"date": "2026-11-04", "rank": 23, "head": "陸自、30年度にも対艦・対空・地上の射撃指揮システムを統合　富士通中心に離島防衛の指揮を迅速化、概算要求179億円", "ind": "防衛", "s": "sec", "c": ["jp", "cn"], "t": "pos", "summ": "陸自は2030年度にも、ミサイルや砲弾の射撃を師団レベルで指揮するシステムを統合する。富士通が中心となって統合し、防衛省は27年度予算の概算要求で179億円以上の関連費用を計上した。判断を迅速にし、砲弾の消耗も抑える。"}, {"date": "2026-11-04", "rank": 22, "head": "公明党、消費税減税法案に衆院で反対の方向で調整　2年限定の効果を疑問視、所得連動の新給付の設計も示されず", "ind": "財政・政治", "s": "rate", "c": ["jp"], "t": "mix", "summ": "公明党は衆院採決で反対する方向で調整に入った。2年限定の減税は物価高対策として効果が低いと判断したほか、政府が所得連動型給付の制度設計を明示していないことを踏まえた。一方、共産党は参政党が出した消費税一律5%の法案に賛成するという異例の一致も起きた。"}, {"date": "2026-11-04", "rank": 21, "head": "香港GDP、7〜9月は5.2%増に加速　AIデータセンター向けの中国製電子機器の輸出が好調", "ind": "海外", "s": "china", "c": ["hk", "cn"], "t": "pos", "summ": "香港政府は7〜9月期の実質GDP（速報値）が前年同期比5.2%増だったと発表した。4〜6月期の4.2%から加速し、季節調整済み前期比でも1.9%増だった。消費も底堅く、通年では政府予想から上振れする可能性が高まった。"}, {"date": "2026-11-04", "rank": 20, "head": "ユーロ圏の10月消費者物価4.0%上昇、4カ月連続で加速　中東情勢でエネルギー高、コアは2.5%で横ばい", "ind": "海外", "s": "rate", "c": ["eu"], "t": "neg", "summ": "EU統計局によると、ユーロ圏の10月の消費者物価指数（速報値）は前年同月比4.0%上昇し、9月の3.8%から伸びが加速した。エネルギー・食品などを除くコアは2.5%で横ばいだった。市場予想と同水準。"}, {"date": "2026-11-04", "rank": 19, "head": "豪中銀、政策金利を4.85%に引き上げ　2会合連続・今年5回目で18年ぶり水準、エネルギー高とAI投資でインフレ加速", "ind": "海外", "s": "rate", "c": ["au"], "t": "neg", "summ": "オーストラリア準備銀行は政策金利を0.25%引き上げ4.85%にした。利上げは2会合連続で、18年ぶりの高水準。声明で「多くの商品・サービスでインフレ率が高止まりしている」と指摘した。"}, {"date": "2026-11-04", "rank": 18, "head": "トランプ氏、中間選挙直後のイラン再攻撃を否定「急いでいない」　バンス副大統領も交渉を明言、水面下の協議を優先", "ind": "海外政治", "s": "mideast", "c": ["us", "ir", "il"], "t": "mix", "summ": "トランプ氏は2日、中間選挙後にイランへの空爆を再開するかを記者団に問われ「いいえ」と否定した。アクシオスの取材にも戦闘再開を「急いでいない」と述べ、水面下で進む交渉を見守る姿勢を示した。バンス副大統領も交渉を明言した。"}, {"date": "2026-11-04", "rank": 17, "head": "サウジアラムコ、7〜9月の純利益35%増の362億ドル　原油高で4年ぶり高水準、ホルムズ通航は不安定続く", "ind": "エネルギー", "s": "mideast", "c": ["sa", "ir", "us"], "t": "mix", "summ": "アラムコの7〜9月期の純利益は前年同期比35%増の362億ドル（約5兆7200億円）で、四半期として4年ぶりの高水準だった。原油高が寄与した。一方、トランプ氏は中間選挙直後のイラン空爆再開を否定し、バンス副大統領も交渉を明言した。"}, {"date": "2026-11-04", "rank": 16, "head": "キーコーヒー、価格改定と独自商品で増収増益続く　生豆高騰・円安で低迷したROEの改善を急ぐ", "ind": "食品", "s": "china", "c": ["jp", "br"], "t": "mix", "summ": "柴田裕社長は豆相場の高騰に合わせて価格改定を進めたことで収益が改善したと述べた。25年発売の新商品など付加価値の高い商品の投入や産地支援でブランド力を強化し、ROEの改善を目指す。"}, {"date": "2026-11-04", "rank": 15, "head": "ヤマトHD、宅急便で大口顧客の運賃を値上げへ　「値段を下げてまで取らない」、拠点は減らしても個人の利便性は維持", "ind": "物流", "s": "demo", "c": ["jp"], "t": "mix", "summ": "桜井敏之社長は日本経済新聞の取材に、大口顧客との運賃交渉で値上げを目指す方針を示した。拠点の削減を進めるが、個人客の利便性は維持するとした。株価は年初来高値に接近した。"}, {"date": "2026-11-04", "rank": 14, "head": "トヨタ系の東海興業、日産系の鬼怒川ゴムを買収　中国勢の台頭で「ケイレツ」超えの部品再編", "ind": "自動車", "s": "china", "c": ["jp", "cn"], "t": "mix", "summ": "東海興業HDは鬼怒川ゴム工業HDの全株式を日本政策投資銀行などから取得し完全子会社化した。取得金額は非公開。トヨタ系と日産系の部品メーカーが一体となり、調達や生産の合理化を進める。"}, {"date": "2026-11-04", "rank": 13, "head": "東京ディズニー、学生向け入園料を最大1000円割引　「キャンパスデーパスポート」を3年ぶりに発売、若年層の来園を取り込む", "ind": "レジャー", "s": "demo", "c": ["jp"], "t": "mix", "summ": "オリエンタルランドは中学生以上の学生を対象に、2027年1月4日〜3月19日に使える最大1000円引きのチケットを発売した。販売は3年ぶりで、春休みなどの閑散期に若年層を取り込む。"}, {"date": "2026-11-04", "rank": 12, "head": "韓国HYBE、7〜9月期の売上高・営業益が過去最高　BTSの世界ツアーで売上2.1倍、「BTS依存」は一段と", "ind": "エンタメ", "s": "china", "c": ["kr", "jp"], "t": "pos", "summ": "HYBEの7〜9月期の売上高は前年同期比2.1倍の1兆5256億ウォン（約1800億円）、営業損益は1885億ウォンの黒字に転換した。いずれも四半期で過去最高。ツアーのチケット・グッズ収入が寄与した。東京市場ではAI株安の中でコンテンツ株が逆行高となった。"}, {"date": "2026-11-04", "rank": 11, "head": "ドコモ、27年3月期に個人向け通信が増収へ　12月の値上げが寄与し純利益は3%減に上方修正、顧客離れの懸念も", "ind": "通信", "s": "demo", "c": ["jp"], "t": "mix", "summ": "ドコモは27年3月期の連結純利益が前期比3%減の6410億円になりそうだと発表し、従来予想から140億円上方修正した。   el('path',{d,class:'arc',stroke:S[a.s].color,'stroke-width':2.2,'marker-end':`url(#h${a.k})`});if(cur!=="all"&&a.l){const t=el('text',{x:mx,y:my,'text-anchor':'middle',class:'lbl','font-size':12/zf,'stroke-width':3/zf});t.textContent=a.l}}
 for(const c in act){const C=M.cent[c];if(C)el('image',{href:`flags/${c}.svg`,x:C[0]-8/zf,y:C[1]-6/zf,width:16/zf,height:12/zf})}
 document.getElementById('legend').innerHTML='<span><i style="background:var(--pos)"></i>追い風</span><span><i style="background:var(--neg)"></i>逆風・緊張</span><span><i style="background:var(--mix)"></i>まちまち</span><span>矢印＝お金・モノ・リスクの流れ（流れを選ぶとラベル表示）</span>';
 document.getElementById('pairs').innerHTML="";
 const p=document.getElementById('panel');if(!selC){p.innerHTML='<h3>この期間・流れのニュースはありません</h3>';return}
 const its=cItems(selC).slice().reverse();p.innerHTML=`<h3>${F(selC,16)}${NM(selC)}</h3><div class="dt">${cur==="all"?"すべての流れ":S[cur].name}・${win===1?"きょう":"直近"+win+"日"}・${its.length}件</div><ul>${its.map(x=>`<li><span class="dt">${md(x.date)}</span>${S[x.s]?`<span class="tag" style="background:${S[x.s].color}">${S[x.s].name}</span>`:""}<span style="color:${col(x.t)}">●</span> ${x.head}</li>`).join("")}</ul><div class="dt" style="margin-top:8px">色の付いた国を押すと切り替わります</div>`}
const pk=(a,b)=>[a,b].sort().join("|");
function agg(){const P={},Dm={};for(const m of D.moves.filter(inWin)){if(m.path[0]===m.path[1]){(Dm[m.path[0]]=Dm[m.path[0]]||[]).push(m);continue}for(let i=0;i<m.path.length-1;i++){if(m.path[i]===m.path[i+1])continue;const k=pk(m.path[i],m.path[i+1]);(P[k]=P[k]||[]).push(m)}}return {P,Dm}}
function drawCo(){const zf=base();const {P,Dm}=agg();const inv=new Set();Object.keys(P).forEach(k=>k.split("|").forEach(c=>inv.add(c)));Object.keys(Dm).forEach(c=>inv.add(c));
 const keys=Object.keys(P).sort((a,b)=>P[b].length-P[a].length).concat(Object.keys(Dm).map(c=>"dom:"+c));
 if(!selPair||!(selPair in P||selPair.startsWith("dom:")&&Dm[selPair.slice(4)]))selPair=keys[0]||null;
 for(const c of M.countries){const p=el('path',{d:c.d,class:'ctry'});if(c.iso&&inv.has(c.iso))p.style.fill='var(--landHi)';const t=el('title',{},p);t.textContent=NM(c.iso)}
 for(const k in P){const [a,b]=k.split("|");const A=M.cent[a],B=M.cent[b];if(!A||!B)continue;const ms=P[k];const cnt={};ms.forEach(m=>cnt[m.k]=(cnt[m.k]||0)+1);const dk=Object.keys(cnt).sort((x,y)=>cnt[y]-cnt[x])[0];
  const [d,mx,my]=curve(A,B);el('path',{d,class:'pair'+(selPair===k?' sel':''),stroke:D.kinds[dk][1],'stroke-width':1.5+Math.min(ms.length,8)*1.4});const h=el('path',{d,class:'pairhit'});h.onclick=()=>{selPair=k;render()};
  const g=el('g',{style:'cursor:pointer'});el('circle',{cx:mx,cy:my,r:9/zf,fill:'var(--card)',stroke:D.kinds[dk][1],'stroke-width':1.5/zf},g);const tx=el('text',{x:mx,y:my+4/zf,'text-anchor':'middle','font-size':11/zf,'font-weight':700,fill:'var(--ink)'},g);tx.textContent=ms.length;g.onclick=()=>{selPair=k;render()}}
 for(const c in Dm){const C=M.cent[c];if(!C)continue;const g=el('g',{style:'cursor:pointer'});el('circle',{cx:C[0]+14/zf,cy:C[1]+11/zf,r:10/zf,fill:'#334155',stroke:selPair==='dom:'+c?'#fbbf24':'none','stroke-width':2/zf},g);const tx=el('text',{x:C[0]+14/zf,y:C[1]+15/zf,'text-anchor':'middle','font-size':11/zf,'font-weight':700,fill:'#fff'},g);tx.textContent=Dm[c].length;const tt=el('title',{},g);tt.textContent=NM(c)+'の国内の企業どうしの動き';g.onclick=()=>{selPair='dom:'+c;render()}}
 for(const c of inv){const C=M.cent[c];if(C)el('image',{href:`flags/${c}.svg`,x:C[0]-8/zf,y:C[1]-6/zf,width:16/zf,height:12/zf})}
 document.getElementById('legend').innerHTML='<span>線の色＝動きの種類／太さ・数字＝件数／紺の丸＝国内どうしの件数</span>';
 const lab=k=>k.startsWith("dom:")?`${F(k.slice(4))}${NM(k.slice(4))}国内`:k.split("|").map(c=>F(c)+NM(c)).join(" ⇄ ");
 document.getElementById('pairs').innerHTML=keys.map(k=>`<button class="${k===selPair?'on':''}" data-k="${k}">${lab(k)} <b>${k.startsWith("dom:")?Dm[k.slice(4)].length:P[k].length}</b></button>`).join("");
 document.querySelectorAll('#pairs button').forEach(b=>b.onclick=()=>{selPair=b.dataset.k;render()});
 const ms=!selPair?[]:selPair.startsWith("dom:")?Dm[selPair.slice(4)]:P[selPair];
 document.getElementById('panel').innerHTML=!selPair?'<h3>この期間の企業の動きはありません</h3><div class="dt">期間を「30日」に広げてください</div>':`<h3>${lab(selPair)}</h3><div class="dt">${ms.length}件・${win===1?"きょう":"直近"+win+"日"}</div>`+ms.slice().reverse().map(m=>`<div class="mv"><span class="kd" style="background:${D.kinds[m.k][1]}">${D.kinds[m.k][0]}</span><span class="who">${coLink(m.a)} → ${coLink(m.b)}</span><div>${m.t}</div><div class="amt">${md(m.date)}　${m.amt&&m.amt!=='—'?'金額：'+m.amt:''}${S[m.s]?' <span class="tag" style="background:'+S[m.s].color+'">'+S[m.s].name+'</span>':''}</div>${m.note?'<div class="nt">🧭 '+m.note+'</div>':''}</div>`).join("");
 bindCo()}
const coLink=n=>D.cos[n]?`<a class="co" data-co="${n}">${n}</a>`:n;
function bindCo(){document.querySelectorAll('[data-co]').forEach(a=>a.onclick=()=>{selCo=a.dataset.co;coSection();document.getElementById('coh').scrollIntoView({behavior:'smooth'})})}
function coSection(){const names=Object.keys(D.cos).filter(n=>!coq||n.includes(coq)).sort((a,b)=>D.cos[b].n-D.cos[a].n||a.localeCompare(b));
 if(!selCo||!D.cos[selCo])selCo=names[0];document.getElementById('cochips').innerHTML=names.slice(0,40).map(n=>`<button class="chip ${n===selCo?'on':''}" style="${n===selCo?'background:#334155':''}" data-co="${n}">${F(D.cos[n].c)}${n}<span class="dt">${D.cos[n].n}</span></button>`).join("");
 const c=D.cos[selCo];if(!c){document.getElementById('cocard').innerHTML='該当なし';return}
 const rel=D.moves.filter(m=>m.a===selCo||m.b===selCo);
 const tl=rel.map(m=>({d:m.date,k:m.k,t:(m.a===selCo?'→ '+m.b:'← '+m.a)+'：'+m.t})).concat(c.kk.map(([d,t])=>({d,k:'kk',t}))).sort((a,b)=>b.d.localeCompare(a.d));
 const KK=Object.assign({},D.kinds,{kk:["その日の動き","#64748b"]});
 const cps=rel.map(m=>{const out=m.a===selCo;return {n:out?m.b:m.a,c:out?m.path[1]:m.path[0],k:m.k}});
 const W=380,H=270,cx=W/2,cy=H/2;let ego=`<svg id="ego" viewBox="0 0 ${W} ${H}">`;cps.forEach((p,i)=>{const an=-Math.PI/2+i*2*Math.PI/Math.max(cps.length,1);const x=cx+Math.cos(an)*125,y=cy+Math.sin(an)*95;
  ego+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="${D.kinds[p.k][1]}" stroke-width="2.5"/><circle cx="${x}" cy="${y}" r="5" fill="${D.kinds[p.k][1]}"/>${p.c?`<image href="flags/${p.c}.svg" x="${x-8}" y="${y+7}" width="16" height="12"/>`:''}<text x="${x}" y="${y-9}" text-anchor="middle">${p.n.length>14?p.n.slice(0,14)+'…':p.n}</text>`});
 ego+=`<circle cx="${cx}" cy="${cy}" r="32" fill="#334155"/><text x="${cx}" y="${cy+4}" text-anchor="middle" style="fill:#fff;stroke:none;font-weight:700">${selCo.length>7?selCo.slice(0,6)+'…':selCo}</text></svg>`;
 document.getElementById('cocard').innerHTML=`<div class="cohead">${F(c.c,18)}<h3>${selCo}</h3><span class="dt">${c.ind||""}${c.code&&c.code!=="—"?"・"+c.code:""}</span></div>${c.lens?`<div class="lens">💡 この会社の動きの見方：${c.lens}</div>`:""}
 <div class="cogrid"><div><div class="sec">動きのタイムライン（新しい順）</div><ul class="tl">${tl.map(x=>`<li style="--c:${KK[x.k][1]}"><span class="dt">${md(x.d)}</span><span class="kd" style="background:${KK[x.k][1]}">${KK[x.k][0]}</span>${x.t}</li>`).join("")}</ul></div>
 <div><div class="sec">つながり（線の色＝動きの種類）</div>${cps.length?ego:'<div class="dt">まだ企業どうしの動きの記録がありません</div>'}</div></div>`;bindCo()}
function chips(){const e=document.getElementById('chips');e.style.display=mode==='flow'?'flex':'none';document.getElementById('kinds').style.display=mode==='co'?'flex':'none';
 e.innerHTML=[`<button class="chip ${cur==='all'?'on':''}" style="${cur==='all'?'background:#334155':''}" data-id="all">すべて</button>`].concat(D.streams.map(s=>`<button class="chip ${cur===s.id?'on':''}" style="${cur===s.id?'background:'+s.color:''}" data-id="${s.id}"><span class="dot" style="background:${cur===s.id?'#fff':s.color}"></span>${s.name}</button>`)).join("");
 e.querySelectorAll('button').forEach(b=>b.onclick=()=>{cur=b.dataset.id;selC=null;render()});
 document.getElementById('kinds').innerHTML=Object.values(D.kinds).map(k=>`<span class="chip static"><span class="dot" style="background:${k[1]}"></span>${k[0]}</span>`).join("")}
function segs(){[["mode","m",mode],["win","w",String(win)],["zoom","z",zoom]].forEach(([id,a,v])=>document.querySelectorAll('#'+id+' button').forEach(b=>b.classList.toggle('on',b.dataset[a]===v)))}
function render(){segs();chips();mode==='flow'?drawFlow():drawCo()}
document.querySelectorAll('#mode button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;render()});
document.querySelectorAll('#win button').forEach(b=>b.onclick=()=>{win=+b.dataset.w;selPair=null;render()});
document.querySelectorAll('#zoom button').forEach(b=>b.onclick=()=>{zoom=b.dataset.z;render()});
document.getElementById('cosearch').oninput=e=>{coq=e.target.value.trim();coSection()};
document.getElementById('links').innerHTML=D.links.filter(l=>S[l[0]]&&S[l[1]]).map(l=>`<span class="link"><b style="color:${S[l[0]].color}">${S[l[0]].name}</b> → <b style="color:${S[l[1]].color}">${S[l[1]].name}</b><br><span style="color:var(--sub)">${l[2]}</span></span>`).join("");
document.getElementById('streams').innerHTML=D.streams.map(s=>{const ev=D.news.filter(n=>n.s===s.id).slice(-5).reverse();const ph=s.phase_hist||[];
 return `<div class="card st" id="s-${s.id}" style="border-top-color:${s.color}"><h3>${s.name}<span>${(s.flags||[]).map(c=>F(c)).join(" ")}</span></h3><p class="one">${s.one}</p>
<div class="sec">いまのフェーズ</div><div class="phase">${D.phases.map((p,i)=>`<span class="${i===s.phase?'cur':''}" style="${i===s.phase?'background:'+s.color:''}">${p}</span>`).join("")}</div>
<div class="phh">${ph.length?ph.slice(-3).reverse().map(h=>`${md(h.date)}：${D.phases[h.phase]}${h.why?"（"+h.why+"）":""}`).join("<br>"):""}</div>
<div class="sec">仕組み</div><div class="mech">${s.mech.map(m=>`<b>${m}</b>`).join("<em>→</em>")}</div>
${(s.ind||[]).length?`<div class="sec">定点指標</div><div class="ind">${s.ind.map(i=>`<div>${i[0]}</div><div>${i[1]}</div>`).join("")}</div>`:""}
<div class="sec">最近の出来事</div><ul class="ev">${ev.length?ev.map(e=>`<li>${e.c.slice(0,2).map(c=>F(c)).join("")}<span><span class="dt">${md(e.date)}</span>${e.head}</span></li>`).join(""):'<li class="dt">直近30日の記録なし</li>'}</ul>
${s.branch?`<div class="sec">次の分岐点</div><div class="kv">${s.branch}</div>`:""}<div class="sec">歴史上の似た局面</div><div class="kv">${s.hist}</div>
<div class="sec">関連する問い</div><div class="qs">${(s.qs||[]).map(q=>`<a href="./deepdives.html">${D.stories[q]||q}</a>`).join("")}</div></div>`}).join("");
document.getElementById('news').innerHTML=D.news.filter(n=>n.date===D.today).sort((a,b)=>a.rank-b.rank).map(n=>`<li>${n.c.map(c=>F(c)).join("")}<span class="ind2">${n.ind}</span><span style="flex:1;min-width:200px">${n.head}</span>${S[n.s]?`<span class="tag" style="background:${S[n.s].color}">${S[n.s].name}</span>`:""}</li>`).join("");
if(location.hash.startsWith("#s-")){setTimeout(()=>document.querySelector(location.hash)?.scrollIntoView(),50)}
render();coSection();
</script></body></html>
